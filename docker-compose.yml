services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: tantara
      POSTGRES_DB: tantara_dev
    ports:
      - "5544:5432"
      - "3000:3000"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tantara"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:22-bookworm
    network_mode: "service:db"
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tantara@localhost:5432/tantara_dev
      MIGRATION_ADMIN_URL: postgresql://tantara@localhost:5432/postgres
      SESSION_SECRET: dev-secret
      NUXT_IGNORE_LOCK: "1"
      AI_PROVIDER: fake
      NOTIFY_PROVIDER: fake
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm
    command: >
      sh -c "corepack enable && pnpm install && pnpm migrate:up && pnpm dev --host 0.0.0.0 --port 3000"

volumes:
  pgdata:
  node_modules:
  pnpm_store:
