<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maki Story · Les enfants</title><style>
@font-face{font-family:Fredoka;font-weight:500;src:url(/fonts/fredoka-500.woff2)}@font-face{font-family:Fredoka;font-weight:700;src:url(/fonts/fredoka-700.woff2)}:root{--bg:#FFF3DC;--paper:#fff;--ink:#1E1A3F;--sky:#CFE5FF;--mint:#ADE6C4;--yellow:#FFC933;--pink:#FF8FC9;--violet:#B28DFF;--accent-ink:#1E1A3F}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px Fredoka,sans-serif}button,select{font:inherit;color:inherit;cursor:pointer}button,a,select{min-height:56px}button,a{touch-action:manipulation}button{padding:12px 24px;border:3px solid var(--ink);border-radius:28px;background:var(--yellow);color:var(--accent-ink);box-shadow:4px 5px 0 var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:12px}button:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}button:focus-visible,a:focus-visible,select:focus-visible{outline:4px solid #8055d9;outline-offset:4px}button:disabled{background:#E5E3F0;box-shadow:none;cursor:default}.secondary{background:var(--paper);color:var(--ink)}.sky{background:var(--sky)}.mint{background:var(--mint)}.demo{padding:12px 20px;background:#1E1A3F;color:#FFF3DC;display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;font-size:14px}.demo button{min-height:44px;font-size:14px;padding:8px 12px;border-color:#FFF3DC;box-shadow:none}.demo a{color:inherit;display:flex;align-items:center}.app{max-width:1040px;margin:auto;padding:24px 24px 128px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700}.brand img{width:48px;height:48px;border-radius:12px}.badge{color:var(--ink);padding:8px 16px;border:2px solid var(--ink);border-radius:24px;background:var(--paper);font-size:16px}.stack{display:grid;gap:24px}.card{background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:4px 5px 0 var(--ink);padding:24px}.welcome{background:var(--sky);color:var(--accent-ink);display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px}.maki{width:160px;height:160px;object-fit:contain}h1{font-size:32px;margin:0 0 12px}h2{font-size:24px;margin:0 0 16px}h3{font-size:20px;margin:8px 0}p{line-height:1.5;margin:12px 0}.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.face{position:relative}.face>button{display:flex;flex-direction:column;width:100%;padding:24px 12px;background:var(--paper);color:var(--ink);gap:12px}.avatar{display:grid;place-items:center;width:112px;height:112px;border:4px solid #1E1A3F;border-radius:50%;background:var(--tone,#B28DFF);color:#1E1A3F;font-size:48px;font-weight:700;flex-shrink:0}.face .bubble{width:56px;display:inline-flex;position:absolute;top:-12px;right:-8px;min-width:56px;height:56px;border-radius:50%;padding:8px;background:var(--yellow)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.book{padding:0;display:flex;flex-direction:column;width:100%;background:var(--paper);color:var(--ink);overflow:hidden}.cover{min-height:240px;padding:24px;background:var(--tone);color:#1E1A3F;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;width:100%}.cover strong{font-size:24px;text-align:left;max-width:200px}.cover span{font-size:72px;align-self:flex-end}.book small{padding:4px 12px 16px;font-size:16px}.row{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}.row>button{max-width:100%}.reader{max-width:720px;margin:auto;text-align:center;background:var(--sky);color:var(--accent-ink)}.reader .avatar{width:160px;height:160px;margin:24px auto;font-size:64px}.reader .maki{width:220px;height:220px}.play{width:96px;height:96px;border-radius:50%;font-size:36px}.dots{display:flex;justify-content:center;gap:12px;margin:24px}.dots i{width:20px;height:20px;border:2px solid #1E1A3F;border-radius:50%;background:#fff}.dots i.on{background:var(--yellow)}.night{background:var(--violet);text-align:center;color:var(--accent-ink)}.night .maki{width:220px;height:220px}.clock{font-size:48px;margin:24px;font-variant-numeric:tabular-nums}.treasure{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.treasure .grow{flex:1;min-width:120px}.treasure .avatar{width:80px;height:80px;font-size:32px}.wave{display:flex;justify-content:center;align-items:center;gap:8px;height:56px;margin:24px}.wave i{width:8px;height:24px;background:var(--accent-ink);border-radius:8px}.wave i:nth-child(2n){height:48px}.wave i:nth-child(3n){height:36px}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--bg);border-top:3px solid var(--ink);display:flex;justify-content:center;padding:12px 16px max(12px,env(safe-area-inset-bottom));gap:16px}nav button{width:180px;background:var(--paper);color:var(--ink);font-size:18px;box-shadow:none}nav button[aria-current=page]{background:var(--yellow);color:var(--accent-ink);box-shadow:3px 4px 0 var(--ink)}dialog{background:var(--bg);color:var(--ink);border:3px solid var(--ink);border-radius:28px;padding:28px;max-width:480px;width:calc(100% - 32px)}dialog::backdrop{background:#1E1A3F88}.notice{padding:16px;text-align:center;font-size:16px;border:2px dashed var(--ink);border-radius:20px}.toast{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);padding:16px 24px;border-radius:24px;background:#1E1A3F;color:white;max-width:90vw;z-index:6}body.dark{--bg:#211d36;--paper:#322c49;--ink:#FFF3DC}body.dark .sky,body.dark .mint,body.dark .welcome,body.dark .night{border-color:var(--ink)}@media(max-width:600px){.app{padding:20px 16px 120px}.welcome{padding:20px;gap:12px}.welcome .maki{width:88px;height:112px}.faces{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}.avatar{width:88px;height:88px;font-size:40px}.face>button{padding:20px 8px}.face .bubble{width:48px;min-width:48px;height:48px;right:-4px}.grid{gap:20px 16px}.cover{min-height:200px;padding:16px}.cover strong{font-size:20px}.cover span{font-size:48px}nav{gap:8px;padding-inline:12px}nav button{width:auto;flex:1;font-size:16px;padding:12px 8px}.badge{font-size:14px;padding:8px 12px}.brand{font-size:20px}.card{padding:20px}.reader .row>button{padding:12px}.reader .maki{width:180px;height:180px}}@media(max-width:359px){.welcome{grid-template-columns:1fr}.welcome .maki{display:none}.brand{font-size:18px}.badge{display:none}.reader .avatar{width:128px;height:128px}.play{width:80px;height:80px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none}}
</style><div class="demo"><span>Maquette enfant · aucune lecture ni demande réelle</span><button id="theme">Thème sombre</button><button data-go="night">Voir le verrouillage</button><a href="adultes.html">Maquettes adultes</a></div><div class="app"><header><div class="brand"><img src="/icon-512.png" alt="">Maki Story</div><span class="badge">Espace de Léa</span></header><main id="view"></main></div><nav aria-label="Navigation enfant"><button data-go="home">⌂ Accueil</button><button data-go="library">▤ Livres</button><button data-go="treasure">♡ Coffre</button></nav><dialog><h2 id="modal-title"></h2><p id="modal-body"></p><form method="dialog"><button class="secondary">Fermer</button></form></dialog><div class="toast" role="status" id="toast" hidden></div><script>
const poses={hello:'lemur-joyeux-faisant-coucou',reading:'lemurien-enchante-lisant-un-livre-magique',heart:'lemurien-calinant-un-cur-rouge-cramoisi',moon:'lemurien-reveur-sous-la-lune-etoilee',champion:'lemurien-champion-et-trophee-dore'};const maki=(pose,cls='')=>`<img class="maki ${cls}" src="/maki/${poses[pose]}.webp" alt="">`;const people=[['Mamie Rose','R','#FF8FC9',2],['Papa','P','#ADE6C4',1],['Tonton Léo','L','#B28DFF',0]];const books=[['Le petit lémurien','🌴','#FFC933'],['La lune qui rit','🌙','#B28DFF'],['Le grand voyage','⛵','#CFE5FF'],['Dans le jardin','🌻','#ADE6C4']];let screen='home',speaker=0,page=1,playing=false,finished=false,title=books[0][0],kept=false;const $=s=>document.querySelector(s);const avatar=(p,large=false)=>`<div class="avatar" style="--tone:${p[2]}">${p[1]}</div>`;const faces=()=>`<div class="faces">${people.map((p,i)=>`<div class="face"><button data-person="${i}" aria-label="Les histoires de ${p[0]}">${avatar(p)}<strong>${p[0]}</strong><small>Ses histoires</small></button>${p[3]?`<button class="bubble" data-message="${i}" aria-label="${p[3]} messages de ${p[0]}">${p[3]} ♪</button>`:''}</div>`).join('')}</div>`;
function home(){return `<div class="stack"><section class="card welcome"><div><h1>Coucou, Léa !</h1><p>Qui as-tu envie d’écouter&nbsp;?</p></div>${maki('hello')}</section>${faces()}<div class="grid"><button class="sky" data-go="library">▤ Toutes mes histoires</button><button class="mint" data-go="treasure">♡ Mes petits trésors</button></div></div>`}
function library(){return `<div class="stack"><div><h1>Mes histoires</h1><p>Prends ton livre, on te raconte la suite.</p></div><div class="grid">${books.map((b,i)=>`<button class="book" data-book="${i}" aria-label="Écouter ${b[0]}"><div class="cover" style="--tone:${b[2]}"><strong>${b[0]}</strong><span aria-hidden="true">${b[1]}</span></div><small>Avec la voix de ${people[i%3][0]}</small></button>`).join('')}</div></div>`}
function listen(){return `<section class="card reader"><span class="badge">${title}</span>${finished?maki('champion'):avatar(people[speaker])}<h1>${finished?'Bravo, histoire terminée !':playing?people[speaker][0]+' raconte…':'Une histoire avec '+people[speaker][0]}</h1><p>${finished?'Encore une fois ?':'Garde ton livre papier près de toi.'}</p><div class="dots" aria-label="Page ${page} sur 3">${[1,2,3].map(n=>`<i class="${n<=page?'on':''}"></i>`).join('')}</div><div class="row">${finished?'<button data-action="restart">↻ Recommencer</button>':`<button class="secondary" data-action="previous" ${page===1?'disabled':''} aria-label="Page précédente">‹</button><button class="play" data-action="play" aria-label="${playing?'Mettre en pause':'Écouter l’histoire'}">${playing?'Ⅱ':'▶'}</button><button class="secondary" data-action="next" aria-label="Page suivante">›</button>`}</div><p class="notice">Lecture simulée · aucun audio dans la maquette.</p><button class="secondary" data-go="library">Retour aux livres</button></section>`}
function message(){return `<section class="card reader">${avatar(people[speaker])}<h1>Un petit mot de ${people[speaker][0]}</h1><div class="wave" aria-hidden="true">${'<i></i>'.repeat(12)}</div><div class="row"><button data-action="listen-message">▶ Écouter</button><button class="secondary" data-action="keep">${kept?'♥ Au coffre':'♡ Garder'}</button></div><p>Tu peux lui répondre avec ta voix.</p><button class="mint" data-action="reply">● Un petit mot pour toi</button><p class="notice">Audio, envoi et coffre simulés.</p></section>`}
function treasure(){return `<div class="stack"><section class="card welcome"><div><h1>Mon coffre</h1><p>${kept?3:2} souvenirs sur 10, rien que pour toi.</p></div>${maki('heart')}</section>${['Le bonne nuit de Mamie','La chanson de Papa',...(kept?['Le petit mot de Mamie']:[])].map((t,i)=>`<article class="card treasure">${avatar(people[i%2])}<div class="grow"><h2>${t}</h2><small>Un souvenir à réécouter</small></div><button data-action="memory" aria-label="Écouter ${t}">▶</button></article>`).join('')}</div>`}
function night(){return `<section class="card night">${maki('moon')}<h1>Maki se repose aussi.</h1><p>Les histoires reviennent demain matin.</p><div class="clock">☀ 7:00</div><button class="secondary" data-action="permission">Demander à un parent</button><p><button data-action="parent">Espace parent</button></p><p class="notice">État verrouillé de démonstration. Aucun contrôle parental réel n’est modifié.</p></section>`}
function render(){document.title='Maki Story · '+({home:'Accueil enfant',library:'Mes histoires',listen:'Lecture',message:'Petit mot',treasure:'Mon coffre',night:'Bonne nuit'})[screen];$('#view').innerHTML=({home,library,listen,message,treasure,night})[screen]();document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.go===screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function go(id){screen=['home','library','listen','message','treasure','night'].includes(id)?id:'home';history.replaceState(null,'','#'+screen);render();window.scrollTo(0,0)}function modal(title,text){$('#modal-title').textContent=title;$('#modal-body').textContent=text;$('dialog').showModal()}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,4000)}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.person!==undefined){speaker=Number(b.dataset.person);go('library');return}if(b.dataset.message!==undefined){speaker=Number(b.dataset.message);go('message');return}if(b.dataset.book!==undefined){const i=Number(b.dataset.book);speaker=i%3;title=books[i][0];page=1;playing=false;finished=false;go('listen');return}switch(b.dataset.action){case'play':playing=!playing;render();break;case'next':if(page===3){finished=true;playing=false}else page++;render();break;case'previous':page=Math.max(1,page-1);render();break;case'restart':page=1;finished=false;playing=false;render();break;case'listen-message':toast('Écoute de démonstration. Aucun son réel.');break;case'keep':kept=true;render();toast('Petit mot fictif gardé dans ton coffre.');break;case'reply':modal('Un petit mot avec ta voix','Dans l’application, tu peux enregistrer puis réécouter ton petit mot avant de l’envoyer. Ici, aucun microphone n’est utilisé et rien n’est envoyé.');break;case'memory':toast('Ton souvenir est prêt à être écouté dans cette démonstration.');break;case'permission':modal('Demande simulée','Un parent reçoit la demande dans la vraie application. Aucun message n’est envoyé depuis cette maquette.');break;case'parent':modal('Le code du parent','Dans l’application, un parent saisit son code personnel. Cette maquette ne déverrouille aucun compte.');break}});$('#theme').addEventListener('click',()=>{document.body.classList.toggle('dark');$('#theme').textContent=document.body.classList.contains('dark')?'Thème clair':'Thème sombre'});window.addEventListener('hashchange',()=>go(location.hash.slice(1)||'home'));go(location.hash.slice(1)||'home');
</script></html>
