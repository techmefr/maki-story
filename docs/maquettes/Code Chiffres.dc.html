<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}</style></helmet>
<div style="max-width:440px;min-height:100vh;margin:0 auto;background:#FFF3DC;padding:24px 20px 32px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;color:#1E1A3F">
<div style="width:100%;display:flex;justify-content:flex-start;align-items:center"><div style="background:#CFE5FF;border:3px solid #1E1A3F;border-radius:16px;box-shadow:3px 4px 0 #1E1A3F;padding:10px 18px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg>Changer de profil</div></div>
<div style="margin-top:20px;width:84px;height:84px;border-radius:50%;background:#4AD3A5;border:3px solid #1E1A3F;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700">B</div>
<div style="margin-top:12px;font-size:24px;font-weight:700">Beau-papa Trésor</div>
<div style="margin-top:14px;font-size:26px;font-weight:700">Entre ton code</div>
<div style="margin-top:8px;font-size:17px;color:#3b3466">Tape ton code secret.</div>
<div style="margin-top:22px;display:flex;gap:12px">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="8"><div style="width:20px;height:20px;border-radius:50%;border:3px solid #1E1A3F;background:{{ d.bg }}"></div></sc-for>
</div>
<div style="margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:340px">
<sc-for list="{{ keys }}" as="k" hint-placeholder-count="10"><button onClick="{{ k.tap }}" style="aspect-ratio:1;border-radius:24px;background:#fff;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-size:40px;font-weight:700;color:#1E1A3F;cursor:pointer;padding:0;grid-column:{{ k.col }}" style-active="transform:translate(3px,4px);box-shadow:1px 1px 0 #1E1A3F">{{ k.n }}</button></sc-for>
<button onClick="{{ back }}" style="grid-column:1;grid-row:4;aspect-ratio:1;border-radius:24px;background:#fff;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg></button>
<button onClick="{{ ok }}" style="grid-column:3;grid-row:4;aspect-ratio:1;border-radius:24px;background:{{ okBg }};border:3px solid {{ okBorder }};box-shadow:4px 5px 0 {{ okBorder }};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="{{ okBorder }}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { code: '' };
  renderVals() {
    const c = this.state.code, n = 8;
    return {
      dots: Array.from({ length: n }, (_, i) => ({ bg: i < c.length ? '#1E1A3F' : '#FFF3DC' })),
      keys: [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => ({ n: d, col: d === 0 ? 2 : 'auto', tap: () => this.setState(st => st.code.length < n ? { code: st.code + d } : null) })),
      back: () => this.setState(st => ({ code: st.code.slice(0, -1) })),
      ok: () => this.setState({ code: '' }),
      okBg: c.length ? '#4AD3A5' : '#ADE6C4',
      okBorder: c.length ? '#1E1A3F' : '#9a9390'
    };
  }
}
</script>
</body>
</html>
