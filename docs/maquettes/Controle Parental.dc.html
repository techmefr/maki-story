<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}</style></helmet>
<div style="max-width:440px;min-height:100vh;margin:0 auto;padding:20px 20px 40px;box-sizing:border-box;color:#1E1A3F;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;gap:12px"><a href="Famille.dc.html" aria-label="Retour" style="width:52px;height:52px;border-radius:50%;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg></a><div style="flex:1;font-size:28px;font-weight:700;line-height:1.1">Contrôle parental</div></div>
<div style="display:flex;gap:10px"><sc-for list="{{ kids }}" as="k" hint-placeholder-count="3"><button onClick="{{ k.tap }}" style="flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:22px;border:3px solid #1E1A3F;background:{{ k.bg }};box-shadow:{{ k.sh }};font-weight:700;font-size:16px;color:#1E1A3F;cursor:pointer"><span style="width:44px;height:44px;border-radius:50%;background:{{ k.c }};border:3px solid #1E1A3F;display:flex;align-items:center;justify-content:center;font-size:22px">{{ k.i }}</span>{{ k.n }}<span style="display:{{ k.lock }};position:absolute;top:-8px;right:-6px;width:26px;height:26px;border-radius:50%;background:#B28DFF;border:2px solid #1E1A3F;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span></button></sc-for></div>
<button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:12px;background:#FFC933;border:3px solid #1E1A3F;border-radius:22px;box-shadow:3px 4px 0 #1E1A3F;padding:12px 14px;cursor:pointer;color:#1E1A3F;text-align:left"><span style="flex:1"><span style="display:block;font-size:19px;font-weight:700">Verrouillage de {{ name }}</span><span style="display:block;font-size:14px">{{ hint }}</span></span><span style="width:64px;height:38px;border-radius:999px;border:3px solid #1E1A3F;background:{{ onBg }};position:relative;flex:none"><span style="position:absolute;top:3px;left:{{ onLeft }};width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #1E1A3F;transition:left .15s"></span></span></button>
<div style="display:flex;flex-direction:column;gap:16px;opacity:{{ opacity }}">
<div style="background:#fff;border:3px solid #1E1A3F;border-radius:24px;padding:14px 16px"><div style="font-size:19px;font-weight:700;margin-bottom:10px">Jours verrouillés</div><div style="display:flex;gap:6px"><sc-for list="{{ days }}" as="d" hint-placeholder-count="7"><button onClick="{{ d.tap }}" style="flex:1;aspect-ratio:1;max-width:48px;border-radius:50%;border:3px solid #1E1A3F;background:{{ d.bg }};box-shadow:{{ d.sh }};font-weight:700;font-size:16px;color:#1E1A3F;cursor:pointer;padding:0">{{ d.n }}</button></sc-for></div>
<div style="display:flex;gap:8px;margin-top:10px"><button onClick="{{ preset1 }}" style="flex:1;padding:8px;border-radius:999px;border:3px solid #1E1A3F;background:#CFE5FF;font-weight:700;font-size:14px;color:#1E1A3F;cursor:pointer">Semaine</button><button onClick="{{ preset2 }}" style="flex:1;padding:8px;border-radius:999px;border:3px solid #1E1A3F;background:#CFE5FF;font-weight:700;font-size:14px;color:#1E1A3F;cursor:pointer">Week-end</button><button onClick="{{ preset3 }}" style="flex:1;padding:8px;border-radius:999px;border:3px solid #1E1A3F;background:#CFE5FF;font-weight:700;font-size:14px;color:#1E1A3F;cursor:pointer">Tous</button></div></div>
<div style="background:#fff;border:3px solid #1E1A3F;border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:14px"><div style="font-size:19px;font-weight:700">Heures de verrouillage</div>
<sc-for list="{{ times }}" as="t" hint-placeholder-count="2"><div style="display:flex;align-items:center;gap:10px"><div style="width:84px;font-size:17px;font-weight:700">{{ t.label }}</div><button onClick="{{ t.minus }}" aria-label="Moins" style="width:46px;height:46px;border-radius:50%;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:2px 3px 0 #1E1A3F;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3.2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button><div style="flex:1;text-align:center;font-size:32px;font-weight:700">{{ t.value }}</div><button onClick="{{ t.plus }}" aria-label="Plus" style="width:46px;height:46px;border-radius:50%;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:2px 3px 0 #1E1A3F;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button></div></sc-for></div>
<div style="background:#E5E3F0;border:3px solid #1E1A3F;border-radius:22px;padding:12px 16px;font-size:17px;font-weight:600;line-height:1.35">{{ summary }}</div></div>
<a href="Ecran Verrouille.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:24px;background:#B28DFF;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;font-weight:700;font-size:18px;text-decoration:none;color:#1E1A3F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Voir l’écran verrouillé</a>
<button onClick="{{ save }}" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border-radius:28px;background:{{ saveBg }};border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:21px;color:#1E1A3F;cursor:pointer;margin-top:auto"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"></path></svg>{{ saveLabel }}</button></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { k: 0, p: null, saved: false };
  K = [['Mattéo', 'M', '#FF7766'], ['Léa', 'L', '#6DB5FF'], ['Noa', 'N', '#4AD3A5']];
  D = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  DN = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
  def() { return [{ on: true, days: [0, 1, 2, 3, 4], from: 1200 + 60 * 0 + 0, to: 420 }, { on: false, days: [0, 1, 2, 3, 4, 5, 6], from: 1260, to: 450 }, { on: true, days: [4, 5], from: 1200, to: 480 }].map(x => ({ ...x, from: x.from > 1439 ? 1260 : x.from })); }
  componentDidMount() { let p = null; try { p = JSON.parse(localStorage.getItem('tantara_lock_v1')); } catch (e) {} this.setState({ p: p || this.def().map((x, i) => (i === 0 ? { ...x, from: 1260 } : x)) }); }
  fmt(m) { const h = Math.floor(m / 60) % 24, mm = m % 60; return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); }
  renderVals() {
    const s = this.state, set = o => this.setState(o), P = s.p;
    if (!P) return { kids: [], days: [], times: [], name: '', hint: '', summary: '', save: () => {}, saveBg: '#E5E3F0', saveLabel: '…', opacity: 1 };
    const k = s.k, r = P[k];
    const upd = o => set({ p: P.map((x, i) => (i === k ? { ...x, ...o } : x)), saved: false });
    const step = (key, d) => upd({ [key]: (r[key] + d + 1440) % 1440 });
    const names = r.days.slice().sort().map(d => this.DN[d]);
    const list = names.length === 7 ? 'tous les jours' : names.length ? 'le ' + names.join(', ').replace(/, ([^,]*)$/, ' et $1') : 'aucun jour';
    return {
      kids: this.K.map(([n, i, c], x) => ({ n, i, c, bg: x === k ? '#FFC933' : '#fff', sh: x === k ? '3px 4px 0 #1E1A3F' : 'none', lock: P[x].on ? 'flex' : 'none', tap: () => set({ k: x }) })),
      name: this.K[k][0], hint: r.on ? 'L’app se verrouille aux heures choisies.' : 'L’app reste toujours accessible.',
      onBg: r.on ? '#4AD3A5' : '#E5E3F0', onLeft: r.on ? '29px' : '3px', toggle: () => upd({ on: !r.on }), opacity: r.on ? 1 : 0.45,
      days: this.D.map((n, d) => { const on = r.days.includes(d); return { n, bg: on ? '#B28DFF' : '#fff', sh: on ? '2px 3px 0 #1E1A3F' : 'none', tap: () => upd({ days: on ? r.days.filter(x => x !== d) : [...r.days, d] }) }; }),
      preset1: () => upd({ days: [0, 1, 2, 3, 4] }), preset2: () => upd({ days: [5, 6] }), preset3: () => upd({ days: [0, 1, 2, 3, 4, 5, 6] }),
      times: [['De', 'from'], ['Jusqu’à', 'to']].map(([label, key]) => ({ label, value: this.fmt(r[key]), minus: () => step(key, -30), plus: () => step(key, 30) })),
      summary: r.on ? this.K[k][0] + ' ne peut pas utiliser l’app ' + list + ', de ' + this.fmt(r.from) + ' à ' + this.fmt(r.to) + ' (le lendemain).' : 'Aucun verrouillage pour ' + this.K[k][0] + '.',
      saveBg: s.saved ? '#ADE6C4' : '#FFC933', saveLabel: s.saved ? 'Enregistré' : 'Enregistrer',
      save: () => { try { localStorage.setItem('tantara_lock_v1', JSON.stringify(P)); } catch (e) {} set({ saved: true }); }
    };
  }
}
</script>
</body>
</html>
