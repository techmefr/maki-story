<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}</style></helmet>
<div style="max-width:440px;min-height:100vh;margin:0 auto;padding:28px 20px 32px;box-sizing:border-box;color:#1E1A3F;display:flex;flex-direction:column;gap:18px">
<div style="font-size:32px;font-weight:700;line-height:1.1">Quelques autorisations</div><div style="font-size:18px;color:#3b3466">Tantara en a besoin pour fonctionner. Tu pourras les changer dans les réglages de ton téléphone.</div>
<sc-for list="{{ items }}" as="p" hint-placeholder-count="3"><div style="background:#fff;border:3px solid #1E1A3F;border-radius:26px;box-shadow:4px 5px 0 #1E1A3F;padding:14px;display:flex;align-items:center;gap:14px"><div style="width:60px;height:60px;border-radius:50%;background:{{ p.color }};border:3px solid #1E1A3F;display:flex;align-items:center;justify-content:center;flex:none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ p.icon }}"></path></svg></div><div style="flex:1;min-width:0"><div style="font-size:20px;font-weight:700;line-height:1.1">{{ p.n }}</div><div style="font-size:15px;color:#3b3466;margin-top:2px">{{ p.why }}</div></div>
<button onClick="{{ p.tap }}" style="display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:{{ p.bg }};border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;font-weight:700;font-size:16px;color:#1E1A3F;cursor:pointer;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ p.bi }}"></path></svg>{{ p.label }}</button></div></sc-for>
<a href="Page Profils.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border-radius:28px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:21px;text-decoration:none;color:#1E1A3F;margin-top:auto"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>Continuer</a>
<div style="text-align:center;font-size:15px;color:#3b3466">Tu peux continuer même sans tout autoriser.</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: {} };
  P = [
    ['mic', 'Micro', 'Pour enregistrer ta voix sur les histoires.', '#FF7766', 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3'],
    ['cam', 'Caméra et photos', 'Pour la photo grimace et les photos des pages.', '#6DB5FF', 'M4 8h3l2-3h6l2 3h3v11H4zM12 10a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z'],
    ['notif', 'Notifications', 'Pour te prévenir d’une nouvelle voix ou d’une relecture.', '#FFC933', 'M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4']
  ];
  renderVals() {
    const s = this.state;
    return { items: this.P.map(([k, n, why, color, icon]) => { const on = !!s.on[k]; return { n, why, color, icon, bg: on ? '#4AD3A5' : '#fff', label: on ? 'Autorisé' : 'Autoriser', bi: on ? 'M5 13l4 4 10-10' : 'M12 5v14M5 12h14', tap: () => this.setState(st => ({ on: { ...st.on, [k]: !st.on[k] } })) }; }) };
  }
}
</script>
</body>
</html>
