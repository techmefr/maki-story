<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}input::placeholder{color:#6b6590}</style></helmet>
<div style="max-width:440px;min-height:100vh;margin:0 auto;padding:20px 20px 60px;box-sizing:border-box;color:#1E1A3F;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:center;gap:12px"><a href="Famille.dc.html" style="width:52px;height:52px;border-radius:50%;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg></a><div style="flex:1;font-size:32px;font-weight:700;line-height:1.1">Ajouter un proche</div></div>
<div style="display:{{ formShow }};flex-direction:column;gap:18px">
<div style="display:flex;gap:10px"><button onClick="{{ tabEmail }}" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:999px;border:3px solid #1E1A3F;background:{{ emailBg }};box-shadow:{{ emailSh }};font-weight:700;font-size:18px;color:#1E1A3F;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg>Par e-mail</button><button onClick="{{ tabCode }}" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:999px;border:3px solid #1E1A3F;background:{{ codeBg }};box-shadow:{{ codeSh }};font-weight:700;font-size:18px;color:#1E1A3F;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h9M18 12v4M15 12v3"></path></svg>Par code</button></div>
<div><div style="font-size:19px;font-weight:700;margin-bottom:10px">Rôle</div><div style="display:flex;gap:10px"><sc-for list="{{ roles }}" as="r" hint-placeholder-count="2"><button onClick="{{ r.tap }}" style="flex:1;padding:10px;border-radius:999px;border:3px solid #1E1A3F;background:{{ r.bg }};box-shadow:{{ r.sh }};font-weight:700;font-size:17px;color:#1E1A3F;cursor:pointer">{{ r.n }}</button></sc-for></div><div style="font-size:15px;color:#3b3466;margin-top:8px">{{ roleHint }}</div></div>
<div style="display:{{ emailShow }};flex-direction:column;gap:12px"><div style="font-size:19px;font-weight:700">Adresse e-mail</div><input value="{{ email }}" onInput="{{ setEmail }}" inputmode="email" placeholder="prenom@exemple.com" style="height:54px;box-sizing:border-box;padding:0 20px;border-radius:999px;border:3px solid #1E1A3F;background:#fff;outline:none;font-family:'Fredoka',sans-serif;font-size:19px;font-weight:600;color:#1E1A3F"><div style="font-size:15px;color:#3b3466">Elle ou il reçoit un lien pour créer son profil et rejoindre la famille.</div></div>
<div style="display:{{ codeShow }};flex-direction:column;gap:12px"><div style="font-size:19px;font-weight:700">Code d’invitation</div><div style="display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #1E1A3F;border-radius:26px;box-shadow:4px 5px 0 #1E1A3F;padding:14px 16px"><div style="flex:1;text-align:center;font-size:40px;font-weight:700;letter-spacing:6px">{{ code }}</div><button onClick="{{ newCode }}" aria-label="Nouveau code" style="width:48px;height:48px;border-radius:50%;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:2px 3px 0 #1E1A3F;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"></path></svg></button></div><div style="font-size:15px;color:#3b3466">Valable 48 h, utilisable une seule fois. La personne le tape à la création de son profil.</div></div>
<button onClick="{{ send }}" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:26px;background:{{ sendBg }};border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:20px;color:#1E1A3F;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ sendIcon }}"></path></svg>{{ sendLabel }}</button></div>
<div style="display:{{ doneShow }};flex-direction:column;align-items:center;gap:16px;text-align:center;padding:30px 0"><div style="width:96px;height:96px;border-radius:50%;background:#4AD3A5;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;display:flex;align-items:center;justify-content:center"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"></path></svg></div><div style="font-size:28px;font-weight:700">{{ doneTitle }}</div><div style="font-size:18px;color:#3b3466;max-width:300px;text-wrap:balance">{{ doneText }}</div><a href="Famille.dc.html" style="display:flex;align-items:center;gap:10px;padding:14px 28px;border-radius:24px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:19px;text-decoration:none;color:#1E1A3F">Retour à la famille</a><button onClick="{{ again }}" style="padding:10px 22px;border-radius:999px;background:#CFE5FF;border:3px solid #1E1A3F;font-weight:700;font-size:17px;color:#1E1A3F;cursor:pointer">Ajouter quelqu’un d’autre</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: 'email', role: 'Proche', email: '', code: '', done: false };
  gen() { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let o = ''; for (let i = 0; i < 6; i++) o += c[Math.floor(Math.random() * c.length)]; return o; }
  componentDidMount() { this.setState({ code: this.gen() }); }
  renderVals() {
    const s = this.state, set = o => this.setState(o), em = s.mode === 'email';
    const valid = !em || /^\S+@\S+\.\S+$/.test(s.email.trim());
    return {
      formShow: s.done ? 'none' : 'flex', doneShow: s.done ? 'flex' : 'none',
      emailBg: em ? '#FFC933' : '#fff', emailSh: em ? '3px 4px 0 #1E1A3F' : 'none', codeBg: em ? '#fff' : '#FFC933', codeSh: em ? 'none' : '3px 4px 0 #1E1A3F',
      tabEmail: () => set({ mode: 'email' }), tabCode: () => set({ mode: 'code' }),
      emailShow: em ? 'flex' : 'none', codeShow: em ? 'none' : 'flex',
      roles: ['Proche', 'Parent'].map(n => ({ n, tap: () => set({ role: n }), bg: s.role === n ? '#FFC933' : '#fff', sh: s.role === n ? '3px 4px 0 #1E1A3F' : 'none' })),
      roleHint: s.role === 'Parent' ? 'Un parent gère la famille avec toi : enfants, proches, livres.' : 'Un proche laisse des vocaux (5 maximum par enfant) et propose des livres.',
      email: s.email, setEmail: e => set({ email: e.target.value }), code: s.code || '······', newCode: () => set({ code: this.gen() }),
      sendBg: valid ? '#FFC933' : '#E5E3F0',
      sendIcon: em ? 'M4 12l16-8-6 16-3-7z' : 'M5 13l4 4 10-10',
      sendLabel: em ? 'Envoyer l’invitation' : 'J’ai donné le code',
      send: () => { if (valid) set({ done: true }); },
      doneTitle: em ? 'Invitation envoyée !' : 'Code prêt !',
      doneText: em ? s.email.trim() + ' va recevoir un lien pour rejoindre la famille comme ' + s.role.toLowerCase() + '.' : 'Le code ' + s.code + ' est valable 48 h pour ajouter un ' + s.role.toLowerCase() + '.',
      again: () => set({ done: false, email: '', code: this.gen() })
    };
  }
}
</script>
</body>
</html>
