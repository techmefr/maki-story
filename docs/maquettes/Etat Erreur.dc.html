<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}</style></helmet>
<div style="position:fixed;inset:0;background:{{ bg }};display:flex;justify-content:center;overflow-y:auto"><div style="width:100%;max-width:440px;min-height:100%;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;color:#1E1A3F">
<div style="width:180px;height:180px;border-radius:50%;background:#fff;border:4px solid #1E1A3F;box-shadow:6px 8px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;animation:float 3s ease-in-out infinite"><svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ icon }}"></path></svg></div>
<div style="display:{{ codeShow }};padding:2px 22px;border-radius:999px;background:#fff;border:3px solid #1E1A3F;font-weight:700;font-size:26px;letter-spacing:2px">{{ code }}</div><div style="font-size:34px;font-weight:700;line-height:1.1;text-wrap:balance">{{ title }}</div><div style="font-size:19px;max-width:320px;text-wrap:balance">{{ text }}</div>
<button onClick="{{ act }}" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 32px;border-radius:28px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:21px;color:#1E1A3F;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ actIcon }}"></path></svg>{{ label }}</button></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hors-ligne&quot;,&quot;mise-a-jour&quot;,&quot;erreur&quot;,&quot;introuvable&quot;,&quot;403&quot;,&quot;500&quot;],&quot;default&quot;:&quot;403&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.type ?? 'hors-ligne';
    const D = {
      'hors-ligne': { bg: '#CFE5FF', title: 'Pas de connexion', text: 'Les histoires déjà téléchargées restent disponibles. Le reste reviendra quand le réseau sera là.', label: 'Réessayer', icon: 'M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M9 17a4 4 0 0 1 6 0M3 3l18 18', actIcon: 'M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4' },
      'mise-a-jour': { bg: '#FFC933', title: 'Une mise à jour est nécessaire', text: 'Pour continuer à écouter et enregistrer, installe la dernière version de Tantara.', label: 'Mettre à jour', icon: 'M12 4v11M7 10l5 5 5-5M5 20h14', actIcon: 'M12 4v11M7 10l5 5 5-5M5 20h14' },
      '403': { bg: '#FFD9D3', code: '403', title: 'Accès réservé aux parents', text: 'Cette page est protégée. Demande à un parent de t’y donner accès.', label: 'Retour à l’accueil', icon: 'M5 11h14v9H5zM8 11V8a4 4 0 0 1 8 0v3M12 15v2', actIcon: 'M4 11l8-7 8 7v9H4zM10 20v-6h4v6' },
      '500': { bg: '#FFC933', code: '500', title: 'Notre serveur a un souci', text: 'Ce n’est pas ta faute. Nous réparons ça : réessaie dans quelques minutes.', label: 'Réessayer', icon: 'M4 5h16v5H4zM4 14h16v5H4zM8 7.500v.5M8 16.500v.5M14 3l-3 5h4l-3 5', actIcon: 'M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4' },
      'erreur': { bg: '#FFD9D3', title: 'Oups, quelque chose a coincé', text: 'Ce n’est pas ta faute. Réessaie dans un instant.', label: 'Réessayer', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 8v5M12 16.5v.5', actIcon: 'M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4' },
      'introuvable': { bg: '#ADE6C4', title: 'Page introuvable', text: 'Cette page n’existe plus ou le lien est incorrect.', label: 'Retour à l’accueil', icon: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4M9 9l4 4M13 9l-4 4', actIcon: 'M4 11l8-7 8 7v9H4zM10 20v-6h4v6' }
    }[k] || {};
    return { ...D, code: D.code || '', codeShow: D.code ? 'block' : 'none', act: () => { if (k === 'hors-ligne' || k === 'erreur' || k === '500') location.reload(); else location.href = 'Page Profils.dc.html'; } };
  }
}
</script>
</body>
</html>
