<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#B28DFF;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}</style></helmet>
<div style="position:fixed;inset:0;background:#B28DFF;display:flex;justify-content:center;overflow-y:auto"><div style="width:100%;max-width:440px;min-height:100%;box-sizing:border-box;padding:32px 20px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;color:#1E1A3F">
<div style="display:{{ lockedShow }};flex-direction:column;align-items:center;gap:18px"><div style="width:190px;height:190px;border-radius:50%;background:#FFF3DC;border:4px solid #1E1A3F;box-shadow:6px 8px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;animation:float 3.5s ease-in-out infinite"><svg width="104" height="104" viewBox="0 0 24 24" fill="#FFC933" stroke="#1E1A3F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></div>
<div style="font-size:36px;font-weight:700;line-height:1.1;text-wrap:balance">L’app dort, {{ name }}</div><div style="font-size:21px;max-width:320px;text-wrap:balance">Elle se réveille à <b>{{ until }}</b>. À demain pour de nouvelles histoires !</div>
<button onClick="{{ ask }}" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 28px;border-radius:26px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:20px;color:#1E1A3F;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Je suis un parent</button></div>
<div style="display:{{ pinShow }};width:100%;flex-direction:column;align-items:center;gap:16px"><div style="font-size:28px;font-weight:700">Code parent</div><div style="display:flex;gap:10px;animation:{{ shake }}"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="4"><div style="width:22px;height:22px;border-radius:50%;border:3px solid #1E1A3F;background:{{ d.bg }}"></div></sc-for></div><div style="display:{{ err }};font-weight:700;background:#FFD9D3;border:3px solid #1E1A3F;border-radius:16px;padding:6px 16px">Mauvais code</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:300px"><sc-for list="{{ keys }}" as="k" hint-placeholder-count="10"><button onClick="{{ k.tap }}" style="aspect-ratio:1.3;border-radius:20px;background:#FFF3DC;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;font-size:30px;font-weight:700;color:#1E1A3F;cursor:pointer;padding:0;grid-column:{{ k.col }}">{{ k.n }}</button></sc-for><button onClick="{{ cancel }}" aria-label="Annuler" style="grid-column:1;grid-row:4;aspect-ratio:1.3;border-radius:20px;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg></button><button onClick="{{ del }}" aria-label="Effacer" style="grid-column:3;grid-row:4;aspect-ratio:1.3;border-radius:20px;background:#FFD9D3;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg></button></div></div>
<div style="display:{{ okShow }};flex-direction:column;align-items:center;gap:16px"><div style="width:100px;height:100px;border-radius:50%;background:#4AD3A5;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;display:flex;align-items:center;justify-content:center"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"></path></svg></div><div style="font-size:28px;font-weight:700">Déverrouillé pour 30 minutes</div><a href="Accueil Enfant.dc.html" style="display:flex;align-items:center;gap:10px;padding:16px 30px;border-radius:26px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:20px;text-decoration:none;color:#1E1A3F">Ouvrir l’app</a></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;prenom&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mattéo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;heure&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;07:00&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ph: 'locked', pin: '', bad: false };
  renderVals() {
    const s = this.state, set = o => this.setState(o), PIN = '1234';
    const tap = n => { const p = s.pin + n; if (p.length < 4) return set({ pin: p, bad: false }); if (p === PIN) set({ ph: 'ok', pin: '' }); else set({ pin: '', bad: true }); };
    return {
      name: this.props.prenom ?? 'Mattéo', until: this.props.heure ?? '07:00',
      lockedShow: s.ph === 'locked' ? 'flex' : 'none', pinShow: s.ph === 'pin' ? 'flex' : 'none', okShow: s.ph === 'ok' ? 'flex' : 'none',
      ask: () => set({ ph: 'pin', pin: '', bad: false }), cancel: () => set({ ph: 'locked', pin: '' }),
      dots: [0, 1, 2, 3].map(i => ({ bg: i < s.pin.length ? '#1E1A3F' : '#FFF3DC' })), err: s.bad ? 'block' : 'none', shake: s.bad ? 'shake .3s' : 'none',
      keys: [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => ({ n, col: n === 0 ? 2 : 'auto', tap: () => tap(n) })), del: () => set({ pin: s.pin.slice(0, -1) })
    };
  }
}
</script>
</body>
</html>
