<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}</style></helmet>
<div style="max-width:440px;min-height:100vh;margin:0 auto;background:#FFF3DC;padding:24px 20px 32px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;color:#1E1A3F">
<div style="width:100%;display:flex;justify-content:flex-start;align-items:center"><div style="background:#CFE5FF;border:3px solid #1E1A3F;border-radius:16px;box-shadow:3px 4px 0 #1E1A3F;padding:10px 18px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg>Changer de profil</div></div>
<div style="margin-top:20px;width:84px;height:84px;border-radius:50%;background:#FF7766;border:3px solid #1E1A3F;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700">M</div>
<div style="margin-top:12px;font-size:24px;font-weight:700">Mattéo</div>
<div style="margin-top:14px;font-size:26px;font-weight:700">Entre ton code</div>
<div style="margin-top:8px;font-size:17px;color:#3b3466">Tape les formes de ton code secret.</div>
<div style="margin-top:22px;display:flex;gap:10px">
<sc-for list="{{ slots }}" as="s" hint-placeholder-count="4"><div style="width:46px;height:46px;border-radius:14px;border:3px solid #1E1A3F;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" style="display:{{ s.show }}"><path d="{{ s.d }}" fill="{{ s.c }}" stroke="#1E1A3F" stroke-width="1.8" stroke-linejoin="round"></path></svg></div></sc-for>
</div>
<div style="margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:340px">
<sc-for list="{{ keys }}" as="k" hint-placeholder-count="6"><button onClick="{{ k.tap }}" style="aspect-ratio:1;border-radius:24px;background:#fff;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:Fredoka,sans-serif;font-weight:700;font-size:15px;color:#1E1A3F" style-active="transform:translate(3px,4px);box-shadow:1px 1px 0 #1E1A3F"><svg width="44" height="44" viewBox="0 0 24 24"><path d="{{ k.d }}" fill="{{ k.c }}" stroke="#1E1A3F" stroke-width="1.6" stroke-linejoin="round"></path></svg><span>{{ k.n }}</span></button></sc-for>
</div>
<button onClick="{{ ok }}" style="margin-top:20px;display:flex;align-items:center;justify-content:center;gap:10px;min-width:180px;padding:14px 32px;border-radius:24px;background:#ADE6C4;border:3px solid {{ okBorder }};box-shadow:4px 5px 0 {{ okBorder }};cursor:pointer;font-family:Fredoka,sans-serif;font-weight:700;font-size:24px;color:{{ okBorder }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{ okBorder }}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"></path></svg>OK</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { code: [] };
  shapes = [
    { n: 'Rond', c: '#FF6B5E', d: 'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z' },
    { n: 'Carré', c: '#4DA3FF', d: 'M4 4h16v16H4z' },
    { n: 'Étoile', c: '#FFC933', d: 'M12 2.5l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.7 5.9 21.1l1.4-6.8L2.2 9.6l6.9-.8z' },
    { n: 'Triangle', c: '#4CC98A', d: 'M12 3L22 20H2z' },
    { n: 'Losange', c: '#A66BFF', d: 'M12 2l9 10-9 10-9-10z' },
    { n: 'Cœur', c: '#FF8FC1', d: 'M12 21C5 15.5 3 12 3 8.8A4.8 4.8 0 0 1 12 6.5 4.8 4.8 0 0 1 21 8.8C21 12 19 15.5 12 21z' }
  ];
  renderVals() {
    const code = this.state.code, n = 4;
    const slots = Array.from({ length: n }, (_, i) => {
      const s = this.shapes[code[i]];
      return { show: s ? 'block' : 'none', d: s ? s.d : '', c: s ? s.c : '#fff' };
    });
    return {
      slots,
      keys: this.shapes.map((s, i) => ({ ...s, tap: () => this.setState(st => st.code.length < n ? { code: [...st.code, i] } : null) })),
      ok: () => this.setState({ code: [] }),
      okBorder: code.length === n ? '#1E1A3F' : '#9a9390'
    };
  }
}
</script>
</body>
</html>
