<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}@keyframes hop{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}</style></helmet>
<div style="max-width:440px;min-height:100vh;margin:0 auto;padding:36px 20px 40px;box-sizing:border-box;color:#1E1A3F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center">
<div style="width:96px;height:96px;border-radius:24px;background:url(logo-maki.png) center/cover;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F"></div>
<div style="display:{{ checkShow }};flex-direction:column;align-items:center;gap:18px"><div style="display:flex;gap:12px;height:40px;align-items:flex-end"><div style="width:18px;height:18px;border-radius:50%;background:#FFC933;border:3px solid #1E1A3F;animation:hop 1s ease-in-out infinite"></div><div style="width:18px;height:18px;border-radius:50%;background:#4AD3A5;border:3px solid #1E1A3F;animation:hop 1s ease-in-out .15s infinite"></div><div style="width:18px;height:18px;border-radius:50%;background:#FF8FC9;border:3px solid #1E1A3F;animation:hop 1s ease-in-out .3s infinite"></div></div><div style="font-size:28px;font-weight:700">On vérifie ton lien…</div></div>
<div style="display:{{ okShow }};flex-direction:column;align-items:center;gap:16px"><div style="width:100px;height:100px;border-radius:50%;background:#4AD3A5;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;animation:pop .5s ease-out"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"></path></svg></div><div style="font-size:32px;font-weight:700;line-height:1.1">C’est bon, bienvenue !</div><div style="font-size:18px;color:#3b3466;max-width:300px;text-wrap:balance">Tu es connecté avec <b style="color:#1E1A3F">prenom@exemple.com</b>. Choisis maintenant qui tu es.</div>
<a href="Page Profils.dc.html" style="display:flex;align-items:center;gap:10px;padding:16px 32px;border-radius:26px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:21px;text-decoration:none;color:#1E1A3F"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>Continuer</a></div>
<div style="display:{{ koShow }};flex-direction:column;align-items:center;gap:16px"><div style="width:100px;height:100px;border-radius:50%;background:#FF7766;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;animation:pop .5s ease-out"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 3h6"></path></svg></div><div style="font-size:32px;font-weight:700;line-height:1.1">Ce lien a expiré</div><div style="font-size:18px;color:#3b3466;max-width:300px;text-wrap:balance">Un lien magique est valable 15 minutes et ne sert qu’une seule fois.</div>
<a href="Connexion.dc.html" style="display:flex;align-items:center;gap:10px;padding:16px 28px;border-radius:26px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:20px;text-decoration:none;color:#1E1A3F"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-7z"></path></svg>Recevoir un nouveau lien</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;etat&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;valide&quot;,&quot;expire&quot;],&quot;default&quot;:&quot;valide&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { phase: 'check' };
  componentDidMount() { this.to = setTimeout(() => this.setState({ phase: (this.props.etat ?? 'valide') === 'expire' ? 'ko' : 'ok' }), 1600); }
  componentWillUnmount() { clearTimeout(this.to); }
  renderVals() {
    const p = this.state.phase;
    return { checkShow: p === 'check' ? 'flex' : 'none', okShow: p === 'ok' ? 'flex' : 'none', koShow: p === 'ko' ? 'flex' : 'none' };
  }
}
</script>
</body>
</html>
