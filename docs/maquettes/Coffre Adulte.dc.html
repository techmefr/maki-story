<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}</style></helmet>
<div style="max-width:440px;min-height:100vh;margin:0 auto;padding:20px 20px 40px;box-sizing:border-box;color:#1E1A3F;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;gap:12px"><a href="Accueil Proche.dc.html" aria-label="Retour" style="width:52px;height:52px;border-radius:50%;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg></a><div style="flex:1;font-size:32px;font-weight:700">Mon coffre</div><div style="padding:4px 14px;border-radius:999px;border:3px solid #1E1A3F;background:#FFC933;font-weight:700;font-size:16px">{{ count }}/10</div></div>
<div style="display:flex;gap:10px"><sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button onClick="{{ t.tap }}" style="flex:1;padding:10px 4px;border-radius:999px;border:3px solid #1E1A3F;background:{{ t.bg }};box-shadow:{{ t.sh }};font-weight:700;font-size:16px;color:#1E1A3F;cursor:pointer">{{ t.n }}</button></sc-for></div>
<sc-for list="{{ items }}" as="m" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #1E1A3F;border-radius:24px;box-shadow:4px 5px 0 #1E1A3F;padding:12px 14px"><div style="width:56px;height:56px;border-radius:50%;background:{{ m.c }};border:3px solid #1E1A3F;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;flex:none">{{ m.i }}</div><div style="flex:1;min-width:0"><div style="font-size:19px;font-weight:700;line-height:1.1">{{ m.from }}</div><div style="display:flex;align-items:center;gap:8px;margin-top:4px"><span style="padding:0 10px;border-radius:999px;border:2px solid #1E1A3F;background:{{ m.kb }};font-weight:700;font-size:13px">{{ m.kind }}</span><span style="font-size:14px;color:#3b3466">{{ m.when }} · {{ m.s }} s</span></div></div>
<button onClick="{{ m.play }}" aria-label="Écouter" style="width:50px;height:50px;border-radius:50%;background:{{ m.pb }};border:3px solid #1E1A3F;box-shadow:2px 3px 0 #1E1A3F;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1E1A3F" stroke="#1E1A3F" stroke-width="2" stroke-linejoin="round"><path d="M8 5l11 7-11 7z"></path></svg></button>
<button onClick="{{ m.del }}" aria-label="Retirer du coffre" style="width:44px;height:44px;border-radius:50%;background:#FFD9D3;border:3px solid #1E1A3F;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button></div></sc-for>
<div style="display:{{ emptyShow }};flex-direction:column;align-items:center;gap:14px;text-align:center;padding:40px 10px"><div style="width:130px;height:130px;border-radius:50%;background:#fff;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;display:flex;align-items:center;justify-content:center"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v10h14V9M10 13h4"></path></svg></div><div style="font-size:26px;font-weight:700">Ton coffre est vide</div><div style="font-size:18px;color:#3b3466;max-width:290px;text-wrap:balance">Garde ici les messages des enfants et ceux que tes proches t’envoient en privé. 10 souvenirs maximum.</div></div>
<a href="Message Enfant.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:26px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:20px;text-decoration:none;color:#1E1A3F;margin-top:auto"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Envoyer un message en privé</a></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;empty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { f: 'Tous', items: null, play: null };
  seed() { return [
    { id: 1, from: 'Mattéo', i: 'M', c: '#FF7766', kind: 'Enfant', when: 'Hier', s: 8 },
    { id: 2, from: 'Papi Serge', i: 'P', c: '#6DB5FF', kind: 'Privé', when: 'Lun.', s: 14 },
    { id: 3, from: 'Léa', i: 'L', c: '#6DB5FF', kind: 'Enfant', when: 'Sam.', s: 6 }
  ]; }
  renderVals() {
    const s = this.state, set = o => this.setState(o), all = s.items || (this.props.empty ? [] : this.seed());
    const list = all.filter(m => s.f === 'Tous' || m.kind === s.f);
    return {
      count: all.length, emptyShow: list.length ? 'none' : 'flex',
      tabs: ['Tous', 'Enfant', 'Privé'].map(n => ({ n: n === 'Enfant' ? 'Enfants' : n === 'Privé' ? 'Privés' : n, bg: s.f === n ? '#FFC933' : '#fff', sh: s.f === n ? '3px 4px 0 #1E1A3F' : 'none', tap: () => set({ f: n }) })),
      items: list.map(m => ({ ...m, kb: m.kind === 'Privé' ? '#B28DFF' : '#FFC933', pb: s.play === m.id ? '#4AD3A5' : '#FFC933',
        play: () => { clearTimeout(this.to); set({ play: m.id }); this.to = setTimeout(() => set({ play: null }), 2200); },
        del: () => set({ items: all.filter(x => x.id !== m.id) }) }))
    };
  }
}
</script>
</body>
</html>
