<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}</style></helmet>
<div style="min-height:100vh;background:rgba(30,26,63,.5);display:flex;justify-content:center"><div style="width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding-top:60px;box-sizing:border-box">
<div style="background:#FFF3DC;border:3px solid #1E1A3F;border-bottom:none;border-radius:32px 32px 0 0;padding:22px 20px 32px;color:#1E1A3F;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:14px">
<div style="width:64px;height:64px;border-radius:50%;background:{{ avatarColor }};border:3px solid #1E1A3F;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;flex:none">{{ initial }}</div>
<div style="flex:1;min-width:0"><div style="font-size:22px;font-weight:700;line-height:1.1">{{ name }}</div><div style="font-size:16px;color:#3b3466">{{ role }} · <span style="font-weight:700">Changer ma photo</span></div></div>
<button onClick="{{ onClose }}" style="width:48px;height:48px;border-radius:50%;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
</div>
<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
<sc-for list="{{ sections }}" as="s" hint-placeholder-count="4">
<div style="background:#fff;border:3px solid #1E1A3F;border-radius:22px;overflow:hidden">
<button onClick="{{ s.tap }}" style="width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;background:transparent;border:none;cursor:pointer;color:#1E1A3F;text-align:left"><span style="flex:1;font-size:18px;font-weight:700">{{ s.label }}</span><span style="font-size:16px;color:#3b3466">{{ s.value }}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate({{ s.rot }}deg)"><path d="M6 9l6 6 6-6"></path></svg></button>
<div style="display:{{ s.show }};flex-wrap:wrap;gap:8px;padding:0 16px 16px"><sc-for list="{{ s.chips }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.tap }}" style="padding:8px 16px;border-radius:999px;border:3px solid #1E1A3F;background:{{ c.bg }};font-weight:700;font-size:16px;color:#1E1A3F;cursor:pointer;display:flex;align-items:center;gap:8px"><span style="display:{{ c.fd }};width:26px;height:18px;border-radius:3px;border:2px solid #1E1A3F;background:{{ c.flag }}"></span>{{ c.n }}</button></sc-for></div>
</div></sc-for>
<div style="background:#fff;border:3px solid #1E1A3F;border-radius:22px;overflow:hidden">
<button onClick="{{ toggleNotif }}" style="width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;background:transparent;border:none;cursor:pointer;color:#1E1A3F;text-align:left"><span style="flex:1;font-size:18px;font-weight:700">Notifications</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate({{ notifRot }}deg)"><path d="M6 9l6 6 6-6"></path></svg></button>
<div style="display:{{ notifShow }};flex-direction:column;gap:14px;padding:0 16px 16px">
<sc-for list="{{ notifs }}" as="r" hint-placeholder-count="6"><div><div style="font-size:16px;font-weight:700;margin-bottom:6px">{{ r.label }}</div><div style="display:flex;gap:8px"><sc-for list="{{ r.chips }}" as="c" hint-placeholder-count="2"><button onClick="{{ c.tap }}" style="padding:6px 14px;border-radius:999px;border:3px solid #1E1A3F;background:{{ c.bg }};font-weight:700;font-size:15px;color:#1E1A3F;cursor:pointer">{{ c.n }}</button></sc-for></div></div></sc-for>
</div>
</div>
<div style="background:#fff;border:3px solid #1E1A3F;border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px;cursor:pointer" onClick="{{ toggleSound }}"><span style="flex:1;font-size:18px;font-weight:700">Sons</span><div style="width:60px;height:34px;border-radius:999px;border:3px solid #1E1A3F;background:{{ soundBg }};position:relative"><div style="position:absolute;top:2px;left:{{ soundLeft }};width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #1E1A3F"></div></div></div>
<input type="range" min="0" max="100" value="{{ volume }}" onInput="{{ setVolume }}" style="display:{{ volShow }};accent-color:#4AD3A5;height:28px;margin:0">
</div>
</div>
<button style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:24px;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:20px;color:#1E1A3F;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-4 3-6 6-6s6 2 6 6M16 4.500a3.500 3.500 0 0 1 0 7M18 14c2 .8 3 2.800 3 6"></path></svg>Changer de profil</button>
<button style="display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:24px;background:#FFD9D3;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:20px;color:#1E1A3F;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h4M10 12h11M17 8l4 4-4 4"></path></svg>Quitter</button>
<div style="text-align:center;font-size:17px;font-weight:700;padding:4px"><a href="#" style="color:#1E1A3F">Donner mon avis</a></div>
</div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { notifOpen: false, nt: {}, open: null, spoken: ['Français', 'Malagasy'], size: 'Normal', theme: 'Clair', lang: 'Français', sound: true, volume: 80 };
  flags = {
    'Français': 'linear-gradient(90deg,#0055A4 33%,#fff 33% 67%,#EF4135 67%)',
    'Malagasy': 'linear-gradient(#FC3D32 50%,#007E3A 50%) right/67% 100% no-repeat,#fff',
    'English': 'linear-gradient(#C8102E,#C8102E) center/100% 22% no-repeat,linear-gradient(#C8102E,#C8102E) center/22% 100% no-repeat,linear-gradient(#fff,#fff) center/100% 44% no-repeat,linear-gradient(#fff,#fff) center/44% 100% no-repeat,#1D3C85',
    'Español': 'linear-gradient(#AA151B 25%,#F1BF00 25% 75%,#AA151B 75%)',
    'Italiano': 'linear-gradient(90deg,#009246 33%,#fff 33% 67%,#CE2B37 67%)',
    'Deutsch': 'linear-gradient(#000 33%,#DD0000 33% 67%,#FFCE00 67%)',
    'Português': 'linear-gradient(90deg,#006600 40%,#FF0000 40%)',
    '中文': 'radial-gradient(circle at 25% 32%,#FFDE00 20%,transparent 22%),#DE2910',
    'العربية': '#006C35'
  };
  renderVals() {
    const s = this.state, set = o => this.setState(o), pr = this.props;
    const all = ['Français', 'Malagasy', 'English', 'Español', 'Italiano', 'Deutsch', 'Português', '中文', 'العربية'];
    const bg = on => on ? '#FFC933' : '#FFF3DC';
    const mk = (id, label, value, names, isOn, pick, fl) => ({
      label, value, rot: s.open === id ? 180 : 0, show: s.open === id ? 'flex' : 'none',
      tap: () => set(st => ({ open: st.open === id ? null : id })),
      chips: names.map(n => ({ n, bg: bg(isOn(n)), tap: () => pick(n), fd: fl && this.flags[n] ? 'block' : 'none', flag: fl && this.flags[n] ? this.flags[n] : 'none' }))
    });
    return {
      name: pr.childName ?? 'Beau-papa Trésor', initial: pr.initial ?? 'B', role: pr.role ?? 'Proche', avatarColor: pr.avatarColor ?? '#4AD3A5', onClose: pr.onClose ?? (() => {}),
      sections: [
        mk('spoken', 'Langues parlées', s.spoken.length + ' choisies', all, n => s.spoken.includes(n), n => set(st => ({ spoken: st.spoken.includes(n) ? st.spoken.filter(x => x !== n) : [...st.spoken, n] })), true),
        mk('lang', 'Langue de l’appli', s.lang, ['Automatique'].concat(all), n => s.lang === n, n => set({ lang: n }), true),
        mk('size', 'Taille du texte', s.size, ['Normal', 'Grand', 'Très grand', 'Énorme', 'Maximum'], n => s.size === n, n => set({ size: n }), false),
        mk('theme', 'Thème', s.theme, ['Clair', 'Sombre', 'Auto'], n => s.theme === n, n => set({ theme: n }), false)
      ],
      notifRot: s.notifOpen ? 180 : 0, notifShow: s.notifOpen ? 'flex' : 'none',
      toggleNotif: () => set(st => ({ notifOpen: !st.notifOpen })),
      notifs: ['Demande d’enregistrement', 'Voix ajoutée', 'Enregistrement terminé', 'Validation ou commentaire', 'Prises à refaire', 'Rappel d’anniversaire'].map(label => ({
        label, chips: ['Notification', 'E-mail'].map(n => { const k = label + n; const on = s.nt[k] !== false; return { n, bg: on ? '#FFC933' : '#FFF3DC', tap: () => set(st => ({ nt: { ...st.nt, [k]: !(st.nt[k] !== false) } })) }; })
      })),
      soundBg: s.sound ? '#4AD3A5' : '#E5E3F0', soundLeft: s.sound ? '28px' : '2px',
      volShow: s.sound ? 'block' : 'none', volume: s.volume,
      toggleSound: () => set(st => ({ sound: !st.sound })),
      setVolume: e => set({ volume: +e.target.value })
    };
  }
}
</script>
</body>
</html>
