<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}</style></helmet>
<div style="position:fixed;inset:0;background:{{ bg }};transition:background .5s ease;display:flex;justify-content:center;overflow-y:auto"><div style="width:100%;max-width:440px;min-height:100%;box-sizing:border-box;padding:20px 20px 28px;display:flex;flex-direction:column;color:#1E1A3F">
<div style="display:flex;justify-content:flex-end;height:48px"><a href="Connexion.dc.html" style="display:{{ skipShow }};align-items:center;padding:0 20px;height:44px;border-radius:999px;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;font-weight:700;font-size:17px;text-decoration:none;color:#1E1A3F">Passer</a></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center"><div key="{{ i }}" style="animation:pop .45s ease-out;display:flex;flex-direction:column;align-items:center;gap:26px">
<div style="display:{{ s0 }};width:240px;height:240px;border-radius:60px;background:url(logo-maki.png) center/cover;border:5px solid #1E1A3F;box-shadow:8px 10px 0 #1E1A3F;animation:float 3s ease-in-out infinite"></div>
<div style="display:{{ s1 }};align-items:center;height:240px"><div style="position:relative;width:260px;height:220px"><div style="position:absolute;left:0;top:30px;width:110px;height:110px;border-radius:50%;background:#FF8FC9;border:4px solid #1E1A3F;box-shadow:5px 6px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:700">M</div><div style="position:absolute;right:0;top:0;width:110px;height:110px;border-radius:50%;background:#6DB5FF;border:4px solid #1E1A3F;box-shadow:5px 6px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:700">P</div><div style="position:absolute;left:75px;bottom:0;width:110px;height:110px;border-radius:50%;background:#B28DFF;border:4px solid #1E1A3F;box-shadow:5px 6px 0 #1E1A3F;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:700">Y</div></div></div>
<div style="display:{{ s2 }};width:200px;height:200px;border-radius:50%;background:#fff;border:5px solid #1E1A3F;box-shadow:8px 10px 0 #1E1A3F;align-items:center;justify-content:center"><svg width="110" height="110" viewBox="0 0 24 24" fill="#FF8FC9" stroke="#1E1A3F" stroke-width="1.6" stroke-linejoin="round"><path d="M12 21C5 15.5 3 12 3 8.8A4.8 4.8 0 0 1 12 6.5 4.8 4.8 0 0 1 21 8.8C21 12 19 15.5 12 21z"></path></svg></div>
<div style="font-size:36px;font-weight:700;line-height:1.1;text-wrap:balance">{{ title }}</div><div style="font-size:20px;line-height:1.35;max-width:320px;text-wrap:balance">{{ text }}</div></div></div>
<div style="display:flex;justify-content:center;gap:10px;margin-bottom:22px"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="3"><div style="width:{{ d.w }}px;height:16px;border-radius:8px;border:3px solid #1E1A3F;background:{{ d.bg }};transition:width .3s"></div></sc-for></div>
<button onClick="{{ next }}" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border-radius:28px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:22px;color:#1E1A3F;cursor:pointer">{{ label }}<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></button>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { i: 0 };
  S = [
    { bg: '#FFF3DC', title: 'Bienvenue sur Tantara', text: 'Les histoires du soir, racontées avec la voix de ceux qu’on aime.' },
    { bg: '#FFC933', title: 'Chacun prête sa voix', text: 'Maman, Papi, Mamie… chacun enregistre un personnage, même de loin.' },
    { bg: '#ADE6C4', title: 'L’enfant écoute et garde', text: 'Il tourne les pages, retrouve ses voix préférées et garde ses souvenirs dans son coffre.' }
  ];
  renderVals() {
    const i = this.state.i, s = this.S[i], last = i === 2;
    return {
      i, bg: s.bg, title: s.title, text: s.text, s0: i === 0 ? 'block' : 'none', s1: i === 1 ? 'flex' : 'none', s2: i === 2 ? 'flex' : 'none',
      skipShow: last ? 'none' : 'flex', label: last ? 'Commencer' : 'Suivant',
      dots: this.S.map((x, k) => ({ w: k === i ? 44 : 16, bg: k === i ? '#1E1A3F' : '#fff' })),
      next: () => { if (last) location.href = 'Connexion.dc.html'; else this.setState({ i: i + 1 }); }
    };
  }
}
</script>
</body>
</html>
