<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}</style></helmet>
<div style="max-width:440px;min-height:100vh;margin:0 auto;padding:24px 20px 32px;box-sizing:border-box;color:#1E1A3F;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div style="background:#CFE5FF;border:3px solid #1E1A3F;border-radius:16px;box-shadow:3px 4px 0 #1E1A3F;padding:10px 18px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg>Retour</div>
<button onClick="{{ clearAll }}" style="display:{{ clearShow }};padding:10px 16px;border-radius:999px;background:#fff;border:3px solid #1E1A3F;font-weight:700;font-size:16px;color:#1E1A3F;cursor:pointer">Tout effacer</button></div>
<div style="font-size:32px;font-weight:700">Notifications</div>
<div style="display:{{ listShow }};flex-direction:column;gap:14px">
<sc-for list="{{ items }}" as="n" hint-placeholder-count="4">
<button onClick="{{ n.tap }}" style="text-align:left;background:#fff;border:3px solid #1E1A3F;border-radius:24px;box-shadow:4px 5px 0 #1E1A3F;padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer;color:#1E1A3F" style-active="transform:translate(3px,4px);box-shadow:1px 1px 0 #1E1A3F">
<div style="width:52px;height:52px;border-radius:50%;background:{{ n.color }};border:3px solid #1E1A3F;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none">{{ n.initial }}</div>
<div style="flex:1;min-width:0"><div style="font-size:18px;font-weight:700;line-height:1.15">{{ n.title }}</div><div style="font-size:16px;color:#3b3466;margin-top:2px">{{ n.text }}</div></div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none"><div style="font-size:14px;color:#3b3466">{{ n.time }}</div><div style="display:{{ n.badgeShow }};background:#FFC933;border:2px solid #1E1A3F;border-radius:999px;padding:1px 10px;font-weight:700;font-size:14px">{{ n.badge }}</div></div>
</button></sc-for>
</div>
<div style="display:{{ emptyShow }};flex:1;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px 0">

<div style="position:relative;width:320px;height:320px"><div id="maki-box" style="width:320px;height:320px"></div><div style="position:absolute;left:6px;top:8px;background:#fff;border:3px solid #1E1A3F;border-radius:16px;box-shadow:3px 4px 0 #1E1A3F;padding:8px 14px;font-weight:700;font-size:17px;color:#1E1A3F">Tout est lu !<div style="position:absolute;left:34px;bottom:-12px;width:18px;height:18px;background:#fff;border-right:3px solid #1E1A3F;border-bottom:3px solid #1E1A3F;transform:rotate(45deg) skew(10deg,10deg);border-bottom-right-radius:4px;z-index:-1"></div></div></div>
<div style="font-size:26px;font-weight:700">Rien de nouveau !</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;empty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { items: [
    { id: 1, color: '#FF8FC9', initial: 'M', title: 'Voix ajoutée', text: 'Maman a laissé un vocal à Mattéo', time: '10 min', badge: '3 / 5' },
    { id: 2, color: '#FF7766', initial: 'M', title: 'Demande d’enregistrement', text: 'Mattéo voudrait t’entendre lire une histoire', time: '1 h', badge: '' },
    { id: 3, color: '#6DB5FF', initial: 'P', title: 'Enregistrement terminé', text: 'Papi Serge a fini son enregistrement', time: 'Hier', badge: '' },
    { id: 4, color: '#B28DFF', initial: 'M', title: 'Prises à refaire', text: 'Mamie Yolande doit refaire 2 prises', time: 'Hier', badge: '2' },
    { id: 5, color: '#4AD3A5', initial: 'B', title: 'Rappel d’anniversaire', text: 'Mattéo fête ses 7 ans dans 3 jours', time: 'Lun.', badge: '' }
  ] };
  componentDidMount() {
    const go = () => {
      const box = document.getElementById('maki-box');
      if (!window.lottie) return setTimeout(go, 200);
      if (!box || box.dataset.ready) return;
      box.dataset.ready = '1';
      window.lottie.loadAnimation({ container: box, renderer: 'svg', loop: true, autoplay: true, path: 'maki-vide.json' });
    };
    go();
  }
  componentDidUpdate() { const b = document.getElementById('maki-box'); if (b && !b.dataset.ready && window.lottie) { b.dataset.ready = '1'; window.lottie.loadAnimation({ container: b, renderer: 'svg', loop: true, autoplay: true, path: 'maki-vide.json' }); } }
  renderVals() {
    const list = (this.props.empty ?? true) ? [] : this.state.items;
    return {
      items: list.map(i => ({ ...i, badgeShow: i.badge ? 'block' : 'none', tap: () => this.setState(st => ({ items: st.items.filter(x => x.id !== i.id) })) })),
      listShow: list.length ? 'flex' : 'none',
      emptyShow: list.length ? 'none' : 'flex',
      clearShow: list.length ? 'block' : 'none',
      clearAll: () => this.setState({ items: [] })
    };
  }
}
</script>
</body>
</html>
