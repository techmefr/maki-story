<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}input::placeholder{color:#6b6590}</style></helmet>
<div style="max-width:440px;min-height:100vh;margin:0 auto;padding:20px 20px 40px;box-sizing:border-box;color:#1E1A3F;display:flex;flex-direction:column;gap:18px">
<a href="Code Chiffres.dc.html" aria-label="Retour" style="align-self:flex-start;width:52px;height:52px;border-radius:50%;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg></a>
<div style="display:{{ form }};flex-direction:column;gap:16px"><div style="font-size:32px;font-weight:700;line-height:1.1">Code oublié ?</div><div style="font-size:18px;color:#3b3466">On t’envoie un lien pour choisir un nouveau code.</div>
<input value="{{ email }}" onInput="{{ setEmail }}" inputmode="email" placeholder="Ton adresse e-mail" style="height:56px;box-sizing:border-box;padding:0 22px;border-radius:999px;border:3px solid #1E1A3F;background:#fff;outline:none;font-family:'Fredoka',sans-serif;font-size:19px;font-weight:600;color:#1E1A3F">
<button onClick="{{ send }}" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:26px;background:{{ bg }};border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:20px;color:#1E1A3F;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-7z"></path></svg>Envoyer le lien</button>
<div style="background:#fff;border:3px dashed #1E1A3F;border-radius:20px;padding:12px 14px;font-size:16px">Tu es un enfant ? Demande à un parent de réinitialiser ton code depuis « Ma famille ».</div></div>
<div style="display:{{ done }};flex-direction:column;align-items:center;gap:14px;text-align:center;padding:30px 0"><div style="width:96px;height:96px;border-radius:50%;background:#ADE6C4;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;display:flex;align-items:center;justify-content:center"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg></div><div style="font-size:28px;font-weight:700">Regarde tes e-mails !</div><div style="font-size:18px;color:#3b3466;text-wrap:balance">Le lien est valable 15 minutes.</div><a href="Code Chiffres.dc.html" style="display:flex;align-items:center;gap:10px;padding:14px 28px;border-radius:24px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:19px;text-decoration:none;color:#1E1A3F"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg>Retour au code</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', sent: false };
  renderVals() {
    const s = this.state, ok = /^\S+@\S+\.\S+$/.test(s.email.trim());
    return { form: s.sent ? 'none' : 'flex', done: s.sent ? 'flex' : 'none', email: s.email, setEmail: e => this.setState({ email: e.target.value }), bg: ok ? '#FFC933' : '#E5E3F0', send: () => ok && this.setState({ sent: true }) };
  }
}
</script>
</body>
</html>
