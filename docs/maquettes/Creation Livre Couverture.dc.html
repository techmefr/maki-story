<div style="display: flex; flex-direction: column; gap: 8px">

</div>

<label for="desc" style="font: 600 15px Fredoka, sans-serif">Description <span style="font-weight: 400; color: #6B66A0">(facultatif)</span></label>
<textarea id="desc" rows="2" placeholder="Consignes de jeu ou contexte" style="width: 100%; box-sizing: border-box; border: 3px solid #221B4A; border-radius: 18px; background: #fff; font: 500 17px Fredoka, sans-serif; color: #2E2766; padding: 12px 16px; resize: none">Lire doucement, avec des silences entre les pages.</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font: 600 15px Fredoka, sans-serif">Type de livre</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button style="border: 3px solid #221B4A; background: #221B4A; color: #fff; border-radius: 999px; font: 700 15px Fredoka, sans-serif; min-height: 44px; padding: 0 16px; cursor: pointer">Livre</button>
<button style="border: 3px solid #221B4A; background: #fff; color: #221B4A; border-radius: 999px; font: 700 15px Fredoka, sans-serif; min-height: 44px; padding: 0 16px; cursor: pointer">Bande dessinée</button>
<button style="border: 3px solid #221B4A; background: #fff; color: #221B4A; border-radius: 999px; font: 700 15px Fredoka, sans-serif; min-height: 44px; padding: 0 16px; cursor: pointer">Sans texte</button>
<button style="border: 3px solid #221B4A; background: #fff; color: #221B4A; border-radius: 999px; font: 700 15px Fredoka, sans-serif; min-height: 44px; padding: 0 16px; cursor: pointer">Écrit par l'enfant</button>
</div>
<span style="font: 400 14px Fredoka, sans-serif; color: #6B66A0">Un livre illustré classique, lu page par page.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font: 600 15px Fredoka, sans-serif">Image de couverture</span>
<div style="display: flex; gap: 10px">
<button style="flex: 1; border: 3px solid #221B4A; background: #fff; border-radius: 999px; font: 700 17px Fredoka, sans-serif; color: #221B4A; min-height: 48px; cursor: pointer">Vierge</button>
<button style="flex: 1; border: 3px solid #221B4A; background: #221B4A; border-radius: 999px; font: 700 17px Fredoka, sans-serif; color: #fff; min-height: 48px; cursor: pointer">Avec photo</button>
</div>

Image</a>

<a href="Creation Livre Page.dc.html" style="margin-top: auto; border: 3px solid #221B4A; background: #FFC72C; border-radius: 999px; box-shadow: 4px 6px 0 #221B4A; font: 700 20px Fredoka, sans-serif; color: #221B4A; min-height: 60px; display: flex; align-items: center; justify-content: center; text-decoration: none">Suivant : page 1</a>
