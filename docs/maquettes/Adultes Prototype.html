<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maki Story · Les adultes</title><style>@font-face{font-family:Fredoka;font-style:normal;font-weight:400;font-display:swap;src:url(../../public/fonts/fredoka-500.woff2) format("woff2")}@font-face{font-family:Fredoka;font-style:normal;font-weight:600;font-display:swap;src:url(../../public/fonts/fredoka-600.woff2) format("woff2")}@font-face{font-family:Fredoka;font-style:normal;font-weight:700;font-display:swap;src:url(../../public/fonts/fredoka-700.woff2) format("woff2")}
:root{--ink:#1E1A3F;--cream:#FFF3DC;--yellow:#FFC933;--mint:#4AD3A5;--coral:#FF7766;--sky:#CFE5FF;--violet:#B28DFF}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px 'Fredoka',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select{min-height:48px}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #6a44c6;outline-offset:4px}button,.button{border:3px solid var(--ink);border-radius:24px;padding:12px 20px;background:var(--yellow);font-weight:600;box-shadow:3px 4px 0 var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:active,.button:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}.secondary{background:white}.mint{background:var(--mint)}.coral{background:var(--coral)}.sky{background:var(--sky)}.plain{box-shadow:none;background:transparent;border-color:transparent}.demo{padding:8px 24px;text-align:center;background:var(--ink);color:var(--cream);font-size:14px}.shell{display:grid;grid-template-columns:240px 1fr;max-width:1600px;margin:auto;min-height:calc(100vh - 36px)}aside{padding:32px 20px;border-right:3px solid var(--ink);display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700}.brand img{width:48px;height:48px;border-radius:12px}nav{display:flex;flex-direction:column;gap:12px}nav button{text-align:left;justify-content:flex-start;box-shadow:none;background:transparent}nav button[aria-current=page]{background:var(--yellow);border-color:var(--ink);box-shadow:3px 4px 0 var(--ink)}.profile{margin-top:auto;padding-top:24px;border-top:2px solid var(--ink)}.profile select{width:100%;margin-top:12px;background:white}main{min-width:0;padding:32px 40px 64px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:14px;font-weight:600}h1{font-size:32px;margin:8px 0}h2{font-size:24px;margin:0 0 16px}h3{font-size:20px;margin:0 0 8px}p{line-height:1.5;margin:8px 0 16px}.muted{color:#51496e}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{border:3px solid var(--ink);border-radius:24px;padding:24px;background:white;box-shadow:4px 5px 0 var(--ink)}.hero{background:var(--yellow);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}.hero h2{font-size:32px}.hero-art{font-size:80px;transform:rotate(-8deg);padding:12px}.avatar{width:56px;height:56px;background:var(--violet);border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:600;flex-shrink:0}.pill{display:inline-block;border:2px solid var(--ink);border-radius:24px;padding:4px 12px;font-size:14px;background:var(--cream)}.cover{height:200px;border:3px solid var(--ink);border-radius:16px;background:var(--sky);display:flex;flex-direction:column;justify-content:space-between;padding:20px;margin-bottom:16px;overflow:hidden}.cover strong{font-size:24px;line-height:1.1;max-width:160px}.cover span{font-size:56px;text-align:right}.book button{width:100%;margin-top:12px}.progress{height:16px;border:2px solid var(--ink);border-radius:24px;background:var(--cream);overflow:hidden;margin:16px 0}.progress span{display:block;background:var(--mint);height:100%}.list{display:grid;gap:16px}.list-item{padding:16px 0;border-bottom:2px solid #e5e3f0}.list-item:last-child{border:0}.grow{flex:1;min-width:0}.chips{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.chips button{background:white;box-shadow:none}.chips button[aria-pressed=true]{background:var(--yellow)}label{display:grid;gap:8px;font-weight:600}input,select,textarea{width:100%;border:3px solid var(--ink);border-radius:20px;background:#fff;padding:12px 16px}textarea{min-height:120px;resize:vertical}.step{display:inline-grid;place-items:center;width:32px;height:32px;border:2px solid var(--ink);border-radius:50%;background:var(--yellow);margin-right:8px}.record{width:112px;height:112px;border-radius:50%;background:var(--coral);font-size:32px;margin:24px auto;display:flex}.center{text-align:center}.wave{height:64px;display:flex;gap:8px;justify-content:center;align-items:center}.wave i{width:8px;background:var(--ink);border-radius:8px;height:24px}.wave i:nth-child(2n){height:48px}.wave i:nth-child(3n){height:64px}.notice{background:var(--sky);padding:16px 20px;border:2px solid var(--ink);border-radius:20px}.page[hidden]{display:none}dialog{border:3px solid var(--ink);border-radius:24px;max-width:480px;width:calc(100% - 32px);padding:24px;color:var(--ink);background:var(--cream)}dialog::backdrop{background:#1e1a3f88}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:16px 24px;border-radius:20px;z-index:10;max-width:90vw}.mobile-brand{display:none}small{font-size:14px}a{color:inherit}@media(min-width:1300px){.books{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:1000px){.shell{grid-template-columns:200px 1fr}main{padding:24px}.grid{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-art{font-size:56px}}@media(max-width:640px){.shell{display:block}aside{border-right:0;border-bottom:3px solid var(--ink);padding:16px;gap:16px}.brand{font-size:20px}.brand img{width:40px;height:40px}nav{flex-direction:row;overflow:auto;padding:0 4px 8px;gap:8px}nav button{flex-shrink:0;padding:8px 12px;font-size:14px}.profile{margin:0;padding:0;border:0;display:flex;align-items:center;gap:12px}.profile select{margin:0;max-width:220px}.profile>small{display:none}main{padding:24px 16px 48px}header{align-items:flex-start;margin-bottom:24px}header>.button{padding:8px 12px;font-size:14px}h1{font-size:32px}.hero{grid-template-columns:1fr}.hero-art{display:none}.card{padding:20px}.books{gap:16px}.cover{height:176px;padding:12px}.cover strong{font-size:20px}.cover span{font-size:40px}.row.wrap>button{flex:1}.demo{padding:8px;font-size:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style><div class="demo">Maquette interactive · données fictives · aucun son ni message réellement envoyé</div><div class="shell"><aside><div class="brand"><img src="../../public/icon-512.png" alt="">Maki Story</div><nav aria-label="Espace adulte"></nav><div class="profile"><small>Vous êtes connecté en tant que</small><select aria-label="Profil de démonstration" id="role"><option value="parent">Camille · parent</option><option value="relative">Mamie Rose · proche</option></select></div></aside><main id="main"><header><div><div class="eyebrow">Famille Moreau</div><h1 id="title">Bonjour, Camille !</h1><span class="muted" id="subtitle">Un peu de votre voix, beaucoup de bonheur.</span></div><button class="secondary" data-action="notifications" aria-label="Voir les notifications">Cloche · 3</button></header><div id="view"></div></main></div><dialog id="dialog"><h2 id="dialog-title"></h2><div id="dialog-content"></div><form method="dialog"><button class="secondary">Fermer</button></form></dialog><div role="status" id="toast" class="toast" hidden></div><script>
const screens=[['home','Accueil'],['library','Livres'],['create','Créer un livre'],['studio','Studio'],['messages','Messages'],['family','Famille']];
const books=[['Le petit lémurien','Une aventure sous les baobabs','🌴','#FFC933','À enregistrer'],['La lune qui rit','Des rêves plein les poches','🌙','#B28DFF','À valider'],['Le grand voyage','Ensemble, au bout du monde','⛵','#CFE5FF','Prêt à écouter'],['Dans le jardin','Les petits secrets du printemps','🌻','#ADE6C4','Prêt à écouter']];
let current='home',filter='Tous',recording=false,step=0,takes=4;const draft={title:'',text:'',voice:'Narrateur'};const saved=new Set();const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const parent=()=>$('#role').value==='parent';const goButton=(id,label,cls='')=>`<button class="${cls}" data-go="${id}">${label}</button>`;const cover=b=>`<div class="cover" style="background:${b[3]}"><strong>${b[0]}</strong><span aria-hidden="true">${b[2]}</span></div>`;const child=(name,color,initial)=>`<div class="avatar" style="background:${color}">${initial}</div><div class="grow"><h3>${name}</h3><span class="muted">Un petit mot fait toujours plaisir</span></div>`;
function bookCard(b){return `<article class="card book">${cover(b)}<span class="pill">${b[4]}</span><h3 style="margin-top:12px">${b[0]}</h3><small class="muted">${b[1]}</small>${(b[4]==='Prêt à écouter'?`<button class="secondary" data-action="book-detail" data-book="${esc(b[0])}">Voir le livre</button>`:goButton(b[4]==='À enregistrer'?'studio':parent()?'family':'library',b[4]==='À enregistrer'?'Enregistrer ma voix':parent()?'Relire le livre':'En attente du parent','secondary'))}</article>`}
function home(){return `<div class="stack"><section class="card hero"><div><span class="pill">Votre voix compte</span><h2 style="margin-top:16px">Une histoire à partager,<br>un lien à garder.</h2><p>Le petit lémurien attend votre voix.<br>4 répliques enregistrées sur 6. Encore un petit moment ensemble ?</p>${goButton('studio','Reprendre mon enregistrement','secondary')}</div><div class="hero-art" aria-hidden="true">🎙️</div></section><div class="grid"><section class="card"><div class="row between"><h2>Des nouvelles des enfants</h2><span class="pill">2 messages</span></div><div class="list"><div class="row list-item">${child('Léa','#FF8FC9','L')}<button class="sky" data-go="messages">Écouter</button></div><div class="row list-item">${child('Noé','#CFE5FF','N')}<button class="secondary" data-go="messages">Écrire avec ma voix</button></div></div></section><section class="card"><h2>${parent()?'Un livre attend votre avis':'On a besoin de vous'}</h2><p>${parent()?'Les voix de La lune qui rit sont prêtes. Une dernière écoute avant de la partager aux enfants.':'Camille vous propose de prêter votre voix au narrateur du Petit lémurien.'}</p>${goButton(parent()?'family':'studio',parent()?'Écouter et valider':'Découvrir mes répliques','mint')}</section></div><section><div class="row between"><h2>Les livres de la famille</h2>${goButton('library','Tout voir','plain')}</div><div class="books">${books.slice(0,3).map(bookCard).join('')}</div></section></div>`}
function library(){let shown=books.filter(b=>filter==='Tous'||b[4]===filter);return `<div class="row wrap between"><p>De belles histoires, racontées par ceux qu’on aime.</p>${goButton('create','+ Ajouter un livre')}</div><div class="chips" aria-label="Filtrer les livres">${['Tous','À enregistrer','À valider','Prêt à écouter'].map(f=>`<button data-filter="${f}" aria-pressed="${filter===f}">${f}</button>`).join('')}</div><div class="books">${shown.map(bookCard).join('')}</div>`}
function create(){return `<div class="stack"><div class="row wrap">${['Couverture','Première page','Vérification'].map((s,i)=>`<span class="pill" style="background:${step===i?'#FFC933':'white'}"><span class="step">${i+1}</span>${s}</span>`).join('')}</div><section class="card">${step===0?`<h2>Quelle histoire allez-vous raconter ?</h2><p class="muted">Le titre suffit pour commencer. Vous pourrez compléter le reste plus tard.</p><div class="grid"><div class="cover center" style="height:280px;background:#CFE5FF"><span aria-hidden="true">📖</span><strong>Votre prochain livre</strong><small>Couverture sans photo</small></div><div class="stack"><label>Titre du livre<input id="book-title" value="${esc(draft.title)}" placeholder="Ex. Le petit lémurien" required></label><label>Type de livre<select><option>Livre</option><option>Bande dessinée</option><option>Sans texte</option><option>Écrit par l’enfant</option></select></label><label>Description facultative<textarea placeholder="Une ambiance, une petite consigne…"></textarea></label><button class="plain" data-action="details">+ Plus de détails</button></div></div>`:step===1?`<h2>Page 1 · ${esc(draft.title)}</h2><div class="grid"><div class="cover center" style="height:320px;background:#ADE6C4"><span aria-hidden="true">🌴</span><strong>Page sans photo</strong><small>L’enfant écoute avec son livre papier.</small></div><div class="stack"><label>Voix de la page<select id="voice-mode"><option>Avec voix</option><option>Sans voix</option></select></label><label>Personnage<input id="voice-name" value="${esc(draft.voice)}"></label><label>Texte à lire<textarea id="page-text" placeholder="Il était une fois…">${esc(draft.text)}</textarea></label><label>Qui la lit ?<select><option>Moi</option><option>Mamie Rose · français</option><option>Proposer à la famille</option><option>Attribuer plus tard</option></select></label></div></div>`:`<h2>Tout est prêt ?</h2><div class="notice"><h3>${esc(draft.title)}</h3><p>1 page · ${draft.silent?'page sans voix':'1 personnage · vous lisez '+esc(draft.voice)}</p><p>${draft.silent?'Aucune demande d’enregistrement ne sera envoyée pour cette page.':esc(draft.text||'Texte à compléter avant l’enregistrement.')}</p></div><p>Les demandes partent quand vous envoyez le livre. La validation d’un parent est nécessaire avant l’écoute par les enfants.</p>`}<div class="row between wrap" style="margin-top:24px">${step?'<button class="secondary" data-action="previous">Retour</button>':'<small class="muted">Brouillon de démonstration</small>'}<button data-action="next">${step===0?'Page suivante':step===1?'Livre fini':'Envoyer le livre'}</button></div></section></div>`}
function studio(){return `<div class="grid"><section class="card">${cover(books[0])}<span class="pill">Français · narrateur</span><h2 style="margin-top:16px">Le petit lémurien</h2><p>Pour Léa et Noé · demandé par Camille</p><div class="progress" aria-label="${takes} répliques sur 6"><span style="width:${takes/6*100}%"></span></div><small>${takes} répliques sur 6 enregistrées</small><div class="chips"><span class="pill">Page 1</span><span class="pill">Page 2</span><span class="pill" style="background:#FFC933">Page 3</span></div></section><section class="card center"><span class="eyebrow">Page 3 · Réplique 5 / 6</span><h2 style="margin-top:16px">À vous de raconter</h2><p class="pill">Avec une voix émerveillée</p><p style="font-size:24px;line-height:1.5;text-align:left">« Tout en haut du grand baobab, Maki aperçut une étoile qui brillait plus fort que les autres. »</p><button class="secondary" data-action="reference">Écouter le texte de référence</button><button class="record" aria-label="${recording?'Arrêter la prise simulée':'Commencer une prise simulée'}" data-action="record">${recording?'■':'●'}</button><strong>${recording?'Prise simulée en cours…':'Un petit souffle… et on y va !'}</strong><p class="muted">La maquette ne demande pas l’accès au micro.</p><button class="mint" data-action="keep" ${recording?'disabled':''}>Garder cette prise et continuer</button></section></div>`}
function messages(){return `<div class="grid"><section class="card"><h2>Les petits mots de Léa</h2><p>Des nouvelles à écouter, des souvenirs à garder.</p><div class="row">${child('Léa','#FF8FC9','L')}</div><div class="notice" style="margin-top:24px"><span class="pill">Nouveau · 18 secondes</span><p style="font-size:20px">Un message rien que pour vous</p><div class="wave" aria-hidden="true">${'<i></i>'.repeat(12)}</div><div class="row wrap"><button data-action="listen">Écouter la démonstration</button><button class="secondary" data-action="save">${saved.has('lea')?'Au coffre ♥':'♡ Garder au coffre'}</button></div></div><p class="muted"><small>Après la première écoute, un message reste disponible 24 h. Gardez-le au coffre pour le conserver.</small></p></section><section class="card"><h2>Répondre avec votre voix</h2><p>Pour Léa · 2 messages actifs sur 5</p><button class="record" data-action="message" aria-label="Simuler un message vocal">●</button><p class="center">Un encouragement, une blague,<br>ou juste « je pense à toi ».</p><div class="notice"><strong>Mon coffre · ${3+saved.size}/10 souvenirs</strong><p>Les petits mots que vous voulez garder tout près.</p><button class="secondary" data-action="vault">Ouvrir mon coffre</button></div></section></div>`}
function family(){if(!parent())return `<section class="card"><h2>La famille Moreau</h2><p>Vous partagez vos histoires avec Léa, Noé et leurs parents.</p><div class="list"><div class="row list-item">${child('Camille · parent','#ADE6C4','C')}</div><div class="row list-item">${child('Alex · parent','#B28DFF','A')}</div></div><div class="notice">Les parents gèrent les invitations, les accès et la validation des livres.</div></section>`;return `<div class="stack"><section class="card" style="background:#CFE5FF"><span class="pill">À valider</span><h2 style="margin-top:16px">La lune qui rit est prête</h2><p>Toutes les voix sont enregistrées. Écoutez le livre avant de le rendre disponible aux enfants.</p><div class="row wrap"><button class="secondary" data-action="review">Écouter la relecture</button><button class="mint" data-action="approve">Valider pour les enfants</button><button class="secondary" data-action="correction">Demander une correction</button></div></section><div class="grid"><section class="card"><h2>Les enfants</h2>${['Léa','Noé'].map((n,i)=>`<div class="row list-item">${child(n,i?'#CFE5FF':'#FF8FC9',n[0])}<button class="secondary" data-action="access" data-name="${n}">Accès</button></div>`).join('')}</section><section class="card"><h2>Les voix de la famille</h2><p>Camille · parent<br>Alex · parent<br>Mamie Rose · proche<br>Papi Jean · proche</p><button data-action="invite">+ Inviter un proche</button></section></div></div>`}
function render(){const titles={home:[`Bonjour, ${parent()?'Camille':'Mamie Rose'} !`,'Un peu de votre voix, beaucoup de bonheur.'],library:['La bibliothèque','Des histoires qui rapprochent.'],create:['Un nouveau livre','Une couverture, une page, une voix à la fois.'],studio:['Mon studio','Racontez à votre rythme.'],messages:['Les petits mots','Le lien continue entre deux histoires.'],family:['Ma famille','Chacun sa place, toutes les voix comptent.']};$('#title').textContent=titles[current][0];$('#subtitle').textContent=titles[current][1];$('nav').innerHTML=screens.map(([id,n])=>`<button data-go="${id}" ${id===current?'aria-current="page"':''}>${n}</button>`).join('');$('#view').innerHTML=({home,library,create,studio,messages,family})[current]();document.title='Maki Story · '+titles[current][0]}
function notify(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function modal(title,html){$('#dialog-title').textContent=title;$('#dialog-content').innerHTML=html;$('#dialog').showModal()}
function navigate(id){current=screens.some(s=>s[0]===id)?id:'home';history.replaceState(null,'','#'+current);render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){navigate(b.dataset.go);return}if(b.dataset.filter){filter=b.dataset.filter;render();return}switch(b.dataset.action){case 'book-detail':modal(b.dataset.book,'<p>Une histoire prête à écouter, racontée par la famille.</p><p>Français · 3 voix · accessible à Léa et Noé.</p><p>La lecture audio est simulée dans cette maquette.</p>');break;case 'notifications':modal('Les nouvelles de votre famille','<p>Léa vous a laissé un petit mot.</p><p>Camille vous attend pour Le petit lémurien.</p><p>La lune qui rit est prête pour la relecture.</p>');break;case 'next':if(step===0){draft.title=$('#book-title').value.trim();if(!draft.title){$('#book-title').reportValidity();return}}if(step===1){draft.text=$('#page-text').value;draft.voice=$('#voice-name').value;draft.silent=$('#voice-mode').value==='Sans voix'}if(step<2){step++;render()}else{notify('Envoi simulé : votre livre est prêt à être partagé.');step=0;navigate('library')}break;case 'previous':step--;render();break;case 'details':modal('Les petits détails','<p>Tout est facultatif pour commencer.</p><label>Langue du livre<select><option>Français</option><option>Malgache</option></select></label><p><label>Auteur<input placeholder="Nom de l’auteur"></label></p><label>Ambiance<input placeholder="Aventure, douceur, humour…"></label>');break;case 'record':recording=!recording;render();break;case 'keep':takes=Math.min(6,takes+1);render();notify(takes===6?'Toutes les prises de démonstration sont prêtes !':'Prise simulée conservée.');break;case 'reference':notify('Démonstration visuelle : aucune voix de référence chargée.');break;case 'listen':notify('Lecture simulée · 18 secondes. Aucun audio personnel.');break;case 'save':saved.add('lea');render();notify('Message fictif ajouté à votre coffre.');break;case 'vault':modal('Mon coffre',`<p>${3+saved.size} souvenirs sur 10.</p><p>♥ Le premier « bonne nuit » de Léa</p><p>♥ La chanson de Noé</p><p>♥ Le fou rire du dimanche</p>${saved.has('lea')?'<p>♥ Le petit mot de Léa</p>':''}`);break;case 'message':modal('Un petit mot pour Léa','<p>Votre message est prêt dans cette démonstration.</p><p>Aucun microphone utilisé. Aucun message envoyé.</p><button data-action="send-message">Simuler l’envoi</button>');break;case 'send-message':$('#dialog').close();notify('Message fictif envoyé à Léa.');break;case 'review':modal('Relecture · La lune qui rit','<p>Page 1 · Narrateur : Mamie Rose</p><p>Page 2 · La lune : Camille</p><p>Page 3 · Narrateur : Mamie Rose</p><p>La lecture audio est simulée dans cette maquette.</p>');break;case 'approve':notify('Validation simulée : le livre est disponible pour Léa et Noé.');break;case 'correction':modal('Une petite reprise ?','<label>Votre message au lecteur<textarea placeholder="Peux-tu relire la page 2 plus doucement ?"></textarea></label><p><button data-action="send-correction">Simuler la demande</button></p>');break;case 'send-correction':$('#dialog').close();notify('Demande de correction simulée.');break;case 'invite':modal('Inviter une nouvelle voix','<label>Adresse e-mail<input type="email" placeholder="proche@example.test"></label><p><label>Rôle<select><option>Proche · raconte et enregistre</option><option>Parent · gère aussi la famille</option></select></label></p><button data-action="send-invite">Simuler l’invitation</button>');break;case 'send-invite':$('#dialog').close();notify('Invitation simulée · aucun e-mail envoyé.');break;case 'access':modal('Les accès de '+b.dataset.name,'<p>Réglages parentaux de démonstration.</p><label>Mode nuit<select><option>De 20 h 30 à 7 h</option><option>Désactivé</option></select></label><p><label>Validation du parent<select><option>Désactivée</option><option>Demander une autorisation à la connexion</option></select></label></p><button data-action="save-access">Enregistrer la simulation</button>');break;case 'save-access':$('#dialog').close();notify('Réglages fictifs enregistrés.');break}});$('#role').addEventListener('change',render);window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));navigate(location.hash.slice(1)||'home');
</script></html>
