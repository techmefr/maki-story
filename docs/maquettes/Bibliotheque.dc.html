<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#FFF3DC;font-family:'Fredoka',sans-serif}a{color:#1E1A3F}a:hover{color:#4a3fa0}button{font-family:'Fredoka',sans-serif}input::placeholder{color:#6b6590}</style></helmet>
<div style="max-width:440px;min-height:100vh;margin:0 auto;padding:24px 20px 40px;box-sizing:border-box;color:#1E1A3F;display:flex;flex-direction:column;gap:18px;position:relative">
<a href="Accueil Proche.dc.html" style="align-self:flex-start;text-decoration:none;background:#CFE5FF;border:3px solid #1E1A3F;border-radius:16px;box-shadow:3px 4px 0 #1E1A3F;padding:10px 18px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;color:#1E1A3F"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg>Retour</a>
<div style="display:flex;align-items:center;gap:12px"><div style="font-size:32px;font-weight:700;flex:1">Bibliothèque</div><div style="background:#FFC933;border:2px solid #1E1A3F;border-radius:999px;padding:0 12px;font-weight:700;font-size:17px">{{ count }}</div></div>
<div style="display:flex;gap:10px">
<div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #1E1A3F;border-radius:999px;padding:0 16px;height:52px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.6" stroke-linecap="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input value="{{ q }}" onInput="{{ setQ }}" placeholder="Chercher un livre" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;color:#1E1A3F"></div>
<button onClick="{{ openF }}" style="position:relative;flex:none;display:flex;align-items:center;gap:8px;padding:0 18px;height:52px;border-radius:999px;background:#FFC933;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;font-weight:700;font-size:17px;color:#1E1A3F;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>Filtres<span style="display:{{ nShow }};position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;border-radius:999px;background:#FF7766;border:2px solid #1E1A3F;font-size:13px;align-items:center;justify-content:center">{{ nActive }}</span></button>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px">
<sc-for list="{{ books }}" as="b" hint-placeholder-count="4"><button onClick="{{ b.open }}" style="text-align:left;background:#fff;border:3px solid #1E1A3F;border-radius:24px;box-shadow:4px 5px 0 #1E1A3F;padding:12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;color:#1E1A3F" style-active="transform:translate(3px,4px);box-shadow:1px 1px 0 #1E1A3F">
<div style="position:relative;aspect-ratio:3/4;border-radius:14px;background:{{ b.color }};border:3px solid #1E1A3F;display:flex;align-items:center;justify-content:center"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.55"><path d="{{ b.icon }}"></path></svg><div style="position:absolute;left:8px;bottom:8px;padding:2px 10px;border-radius:999px;border:2px solid #1E1A3F;background:{{ b.stBg }};font-weight:700;font-size:13px">{{ b.status }}</div></div>
<div><div style="font-size:18px;font-weight:700;line-height:1.1">{{ b.title }}</div><div style="font-size:14px;color:#3b3466;margin-top:2px">{{ b.theme }} · {{ b.mood }}</div></div></button></sc-for>
</div>
<div style="display:{{ emptyShow }};text-align:center;font-size:20px;font-weight:700;padding:30px 0">Aucun livre trouvé</div>

<div style="display:{{ fShow }};position:fixed;inset:0;z-index:10;background:rgba(30,26,63,.45);justify-content:center;align-items:flex-end" onClick="{{ closeF }}">
<div onClick="{{ stop }}" style="width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:#FFF3DC;border:3px solid #1E1A3F;border-bottom:none;border-radius:32px 32px 0 0;padding:20px 20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:12px"><div style="flex:1;font-size:26px;font-weight:700">Filtres</div><button onClick="{{ closeF }}" style="width:48px;height:48px;border-radius:50%;background:#CFE5FF;border:3px solid #1E1A3F;box-shadow:3px 4px 0 #1E1A3F;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg></button></div>
<div><div style="font-size:19px;font-weight:700;margin-bottom:12px">Univers</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
<sc-for list="{{ themes }}" as="t" hint-placeholder-count="6"><button onClick="{{ t.tap }}" style="background:{{ t.bg }};border:3px solid #1E1A3F;border-radius:22px;box-shadow:{{ t.sh }};padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:#1E1A3F;position:relative"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.icon }}"></path></svg><span style="font-weight:700;font-size:15px">{{ t.n }}</span><span style="display:{{ t.ck }};position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#4AD3A5;border:2px solid #1E1A3F;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E1A3F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"></path></svg></span></button></sc-for>
</div></div>
<div><div style="font-size:19px;font-weight:700;margin-bottom:12px">Ambiance</div>
<div style="display:flex;flex-wrap:wrap;gap:10px"><sc-for list="{{ moods }}" as="c" hint-placeholder-count="5"><button onClick="{{ c.tap }}" style="padding:8px 18px;border-radius:999px;border:3px solid #1E1A3F;background:{{ c.bg }};box-shadow:{{ c.sh }};font-weight:700;font-size:16px;color:#1E1A3F;cursor:pointer">{{ c.n }}</button></sc-for></div></div>
<div><div style="font-size:19px;font-weight:700;margin-bottom:12px">Statut</div>
<div style="display:flex;flex-wrap:wrap;gap:10px"><sc-for list="{{ statuses }}" as="c" hint-placeholder-count="4"><button onClick="{{ c.tap }}" style="padding:8px 18px;border-radius:999px;border:3px solid #1E1A3F;background:{{ c.bg }};box-shadow:{{ c.sh }};font-weight:700;font-size:16px;color:#1E1A3F;cursor:pointer">{{ c.n }}</button></sc-for></div></div>
<div style="display:flex;gap:12px"><button onClick="{{ reset }}" style="flex:none;padding:14px 20px;border-radius:24px;background:#fff;border:3px solid #1E1A3F;font-weight:700;font-size:18px;color:#1E1A3F;cursor:pointer">Réinitialiser</button><button onClick="{{ closeF }}" style="flex:1;padding:14px;border-radius:24px;background:#4AD3A5;border:3px solid #1E1A3F;box-shadow:4px 5px 0 #1E1A3F;font-weight:700;font-size:19px;color:#1E1A3F;cursor:pointer">Voir {{ shown }} livres</button></div>
</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { q: '', open: false, th: [], md: [], stt: [] };
  icons = {
    Western: 'M2 17c3 1.5 6 1.500 10 1.500s7 0 10-1.500M6.500 15c0-5 1-9 3-9 1 0 1.500 1 2.500 1s1.500-1 2.500-1c2 0 3 4 3 9M7 12.500c3 1 7 1 10 0',
    Océan: 'M2 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0M2 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0M2 19c2-2 4-2 6 0s4 2 6 0 4-2 6 0',
    Forêt: 'M12 3l6 8h-3l4 6H5l4-6H6zM12 17v4',
    Espace: 'M12 2.500l2.900 6.300 6.900.8-5.100 4.700 1.400 6.800L12 17.700 5.900 21.100l1.400-6.800L2.200 9.600l6.900-.8z',
    Château: 'M3 19L2 8l5 4 5-7 5 7 5-4-1 11zM4 22h16',
    Animaux: 'M12 20c-3 0-6-2-6-4.500S9 12 12 12s6 1 6 3.500S15 20 12 20zM5.500 10.500a1.500 1.500 0 1 0 .01 0M9.500 6.500a1.500 1.500 0 1 0 .01 0M14.500 6.500a1.500 1.500 0 1 0 .01 0M18.500 10.500a1.500 1.500 0 1 0 .01 0'
  };
  tcol = { Western: '#FFC933', Océan: '#6DB5FF', Forêt: '#4AD3A5', Espace: '#B28DFF', Château: '#FF8FC9', Animaux: '#FF7766' };
  all = [
    ['Le petit lémurien', 'Animaux', 'Calme', 'À enregistrer'],
    ['La lune qui rit', 'Espace', 'Drôle', 'À enregistrer'],
    ['Au bord du lac', 'Forêt', 'Calme', 'À corriger'],
    ['Le shérif Pistache', 'Western', 'Drôle', 'Proposé'],
    ['Dans la forêt', 'Forêt', 'Mystère', 'Enregistré'],
    ['Le grand voyage', 'Océan', 'Aventure', 'À corriger'],
    ['La princesse Jade', 'Château', 'Câlin', 'À enregistrer'],
    ['Cow-boy Gaston', 'Western', 'Aventure', 'Enregistré'],
    ['Le poisson d’argent', 'Océan', 'Câlin', 'Proposé']
  ];
  renderVals() {
    const { q, open, th, md, stt } = this.state, set = o => this.setState(o);
    const tog = (key, v) => set(st => ({ [key]: st[key].includes(v) ? st[key].filter(x => x !== v) : [...st[key], v] }));
    const chip = (key, arr, n) => ({ n, tap: () => tog(key, n), bg: arr.includes(n) ? '#FFC933' : '#fff', sh: arr.includes(n) ? '3px 4px 0 #1E1A3F' : 'none' });
    const bgs = { 'À enregistrer': '#FF7766', 'À corriger': '#FFC933', 'Proposé': '#FFF3DC', 'Enregistré': '#ADE6C4' };
    const list = this.all.filter(b => (!th.length || th.includes(b[1])) && (!md.length || md.includes(b[2])) && (!stt.length || stt.includes(b[3])) && b[0].toLowerCase().includes(q.toLowerCase()));
    const n = th.length + md.length + stt.length;
    return {
      count: this.all.length, q, setQ: e => set({ q: e.target.value }),
      openF: () => set({ open: true }), closeF: () => set({ open: false }), stop: e => e.stopPropagation(),
      fShow: open ? 'flex' : 'none', nActive: n, nShow: n ? 'flex' : 'none', shown: list.length,
      reset: () => set({ th: [], md: [], stt: [] }),
      themes: Object.keys(this.icons).map(t => ({ n: t, icon: this.icons[t], bg: th.includes(t) ? this.tcol[t] : '#fff', sh: th.includes(t) ? '3px 4px 0 #1E1A3F' : 'none', ck: th.includes(t) ? 'flex' : 'none', tap: () => tog('th', t) })),
      moods: ['Calme', 'Drôle', 'Aventure', 'Câlin', 'Mystère'].map(c => chip('md', md, c)),
      statuses: ['À enregistrer', 'À corriger', 'Proposé', 'Enregistré'].map(c => chip('stt', stt, c)),
      books: list.map(([title, theme, mood, status]) => ({ title, theme, mood, status, color: this.tcol[theme], icon: this.icons[theme], stBg: bgs[status], open: () => { location.href = 'Livre Detail.dc.html'; } })),
      emptyShow: list.length ? 'none' : 'block'
    };
  }
}
</script>
</body>
</html>
